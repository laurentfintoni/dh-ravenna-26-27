</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-marpit-fragments="2" data-paginate="true" data-class="steps" data-footer="1/ Kirschenbaum, M. (2010). What Is Digital Humanities and What’s It Doing in English Departments? In M. K. Gold (Ed.), *Debates in the Digital Humanities*. University of Minnesota Press. https://doi.org/10.5749/9781452963754 2/ Burdick, A., Drucker, J., Lunenfeld, P., Presner, T., &amp; Schnapp, J. (2012). *Digital_Humanities*. The MIT Press. https://doi.org/10.7551/mitpress/9248.001.0001" data-theme="r7groxpkkcsfv281ok7aknbrnulalqkqisv0xhioyb" lang="en-US" class="steps" data-marpit-pagination="3" style="--paginate:true;--class:steps;--footer:1/ Kirschenbaum, M. (2010). What Is Digital Humanities and What’s It Doing in English Departments? In M. K. Gold (Ed.), *Debates in the Digital Humanities*. University of Minnesota Press. https://doi.org/10.5749/9781452963754 2/ Burdick, A., Drucker, J., Lunenfeld, P., Presner, T., &amp; Schnapp, J. (2012). *Digital_Humanities*. The MIT Press. https://doi.org/10.7551/mitpress/9248.001.0001;--theme:r7groxpkkcsfv281ok7aknbrnulalqkqisv0xhioyb;" data-marpit-pagination-total="33" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p>&quot;At its core digital humanities is more akin to <strong>a common methodological outlook</strong> than an investment in any one specific set of texts or even technologies. [...] Yet it is also <strong>a social undertaking</strong>.&quot; — Kirschenbaum (2010)</p>
</blockquote>
</li>
<li data-marpit-fragment="2">
<blockquote>
<p>&quot;Digital Humanities is born of the <strong>encounter between traditional humanities and computational methods</strong>.&quot; — Burdick et al. (2012)</p>
</blockquote>
</li>
</ul>
<footer>1/ Kirschenbaum, M. (2010). What Is Digital Humanities and What’s It Doing in English Departments? In M. K. Gold (Ed.), <em>Debates in the Digital Humanities</em>. University of Minnesota Press. <a href="https://doi.org/10.5749/9781452963754">https://doi.org/10.5749/9781452963754</a> 2/ Burdick, A., Drucker, J., Lunenfeld, P., Presner, T., &amp; Schnapp, J. (2012). <em>Digital_Humanities</em>. The MIT Press. <a href="https://doi.org/10.7551/mitpress/9248.001.0001">https://doi.org/10.7551/mitpress/9248.001.0001</a></footer>

<ul>
<li data-marpit-fragment="1">
<blockquote>
<p>&quot;Definire il concetto di DH non è impresa facile. Lo statuto di questo ambito, o anche settore o ancora area di ricerca, <strong>varia al variare del punto di vista dell’osservatore</strong>.&quot; — Tomasi (2022)</p>
</blockquote>
</li>
<li data-marpit-fragment="2">
<blockquote>
<p>&quot;Digital humanities leverages technology to enhance research, analysis, communication, and the sharing of knowledge in the humanities, ultimately leading to <strong>a deeper understanding of human culture and society</strong>.&quot; — Betik &amp; Cors (2023)</p>
</blockquote>
</li>
</ul>

"right">
<h3 id="cera-una-volta">C'era una volta...</h3>
<p>Un sacerdote gesuita interessato a realizzare una concordanza di tutte le parole di Tommaso d’Aquino.</p>
<p>Dal 1946 al 1980, Roberto Busa e il suo team (con il sostegno di IBM) hanno realizzato l'<em>Index Thomisticus</em>, utilizzando schede perforate per l’inserimento dei dati.</p>
<p>Questo progetto ha contribuito alla crescita del settore dell’<strong>informatica applicata alle discipline umanistiche</strong>, che si è poi evoluto nelle DH.</p>
<footer>Image: Roberto Busa, with the Index Thomisticus in the background (2006), Antonio G. Colombo / Wikipedia.</footer>
</section>

<h3 id="cera-una-volta-1">C'era una volta...</h3>
<p>Un’altra storia su come sono nate le DH.</p>
<p>Una storia in cui l’arte, la cultura dei primi schermi elettronici e le idee femministe offrono una fonte di ispirazione diversa per questo campo.</p>
<p>Questa è, in un certo senso, una delle origini del lato creativo delle DH, ovvero il modo in cui esse <strong>combinano il digitale e il fisico per esplorare cosa significhi essere umani</strong>.</p>

tional Archives." data-theme="r7groxpkkcsfv281ok7aknbrnulalqkqisv0xhioyb" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--footer:Image: Melba Roy, National Archives.;--theme:r7groxpkkcsfv281ok7aknbrnulalqkqisv0xhioyb;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="33" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="perch%C3%A9-dh">Perché DH?</h3>
<p>Perché agli accademici piace discutere e definire le cose. <strong>Il termine fa la sua comparsa nei primi anni 2000</strong>, in parte grazie all’antologia <em>A Companion to Digital Humanities</em> (2004).</p>
<h3 id="quindi-le-dh-sono">Quindi le DH sono?</h3>
<p>Un insieme di discipline che esplora, sviluppa e applica metodi e strumenti digitali alle scienze umanistiche senza perdere di vista l'esperienza umana.</p>
<p>(<img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> questo rimane solo una versione di cosa possono essere, comunque)</p>
<footer>Image: Melba Roy, National Archives.</footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-footer="Image: Melba Roy, National Archives." data-theme="r7groxpkkcsfv281ok7aknbrnulalqkqisv0xhioyb" lang="en-US" data-marpit-pagination="7" style="" data-marpit-pagination-total="33" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-theme="r7groxpkkcsfv281ok7aknbrnulalqkqisv0xhioyb" lang="en-US" style="--theme:r7groxpkkcsfv281ok7aknbrnulalqkqisv0xhioyb;" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}">
<h3 id="le-dh-oggi">Le DH oggi...</h3>
<p>Un incontro tra analogico e digitale, tradizione e innovazione, attraverso il quale analizziamo e mettiamo in discussione i paradigmi esistenti e cerchiamo modi per (ri)utilizzare e (ri)creare i dati umanistici.</p>
<p>Digitalizzazione. Studi testuali. Archivi. Collezioni. Studi multimediali. Epistemologia. Web semantico. Studi sui dati. Studi critici. Storia dell’arte. Archeologia. Apprendimento automatico. Ingegneria della conoscenza. Sistemi di ricerca. Interfacce. Studi sui social media. E molto altro ancora! Fonti diverse. Metodologie diverse. Ambiti diversi.</p>
<p><strong>L’incontro tra discipline umanistiche e informatica rimane, idealmente, un filo conduttore comune</strong>:</p>
<ul>
<li>L’informatica dovrebbe supportare l’umanista;</li>
<li>L’umanista dovrebbe interrogare/contestualizzare l’informatica.</li>
</ul>
</section>

<h1 id="dh-values">DH <strong>values</strong></h1>

<h3 id="lavoro-e-comunit%C3%A0">Lavoro e comunità</h3>
<p>Quindi, le DH sono diversi a seconda delle persone. Si tratta di una vasta comunità di professionisti che riflettono, ricercano, analizzano e producono.</p>
<p>Un modo per superare queste differenze è aggrapparsi a un <strong>insieme condiviso di valori</strong>: non per limitare la nostra identità, ma per ispirarci e ricordarci ciò che conta.</p>
<p>I valori ci ricordano ciò in cui crediamo e cosa c’è in gioco nel nostro lavoro.</p>

<h3 id="this-is-why-we-fight">This is why we fight</h3>
<p>Nel 2012, Lisa Spiro ha proposto la seguente serie di valori DH per il campo:</p>
<p><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/> Openness<br />

<img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/33-20e3.svg" data-marp-twemoji=""/> Collegiality and Connectedness<br />
<img class="emoji" draggable="false" alt="4️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/34-20e3.svg" data-marp-twemoji=""/> Diversity<br />
<img class="emoji" draggable="false" alt="5️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/35-20e3.svg" data-marp-twemoji=""/> Experimentation</p>
<p>L'intenzione era quella di fornire uno spunto, <strong>una guida per riflettere sul “perché”, non solo sul “come”</strong>.</p>

<p><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/> Openness<br />

<p>Un’ultima riflessione su cui torneremo nel corso della settimana: quale lavoro, che non si vede, rende possibile ciò che usi?</p>
<blockquote>
<p>&quot;To create a truly critical digital humanities we should acknowledge and foreground the interdependencies between different kinds of labor.&quot; — Reed (2016)</p>
</blockquote>

<h3 id="work--credit-%E2%9C%85">Work = Credit <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></h3>
<p>I DH si basano in gran parte sui dati, ma questi dati non nascono dal nulla. <strong>Dietro alla digitalizzazione ci sono persone il cui lavoro l'ha reso possibile</strong>.</p>
<p>Padre Busa non avrebbe potuto “creare” l’<em>Index Thomisticus</em> senza le donne che perforavanno le schede. Eppure sono rimaste invisibili fino agli anni 2010.</p>
<p>Questo tipo di lavoro non è di minore importanza, anzi, spesso <em>è il più importante</em>.</p>

<h3 id="cera-una-volta-2">C'era una volta...</h3>
<p>1854, quartiere di Soho, Londra.</p>
<p>Un’epidemia di colera causa decine di morti in pochi giorni.</p>
<p>John Snow, un medico, decide di mappare i casi, identificando ogni evento di contagio e segnalandolo su una mappa del quartiere.</p>
<p>I <strong>dati raccolti da Snow e la loro visualizzazione</strong> permettono di rintracciare la fonte dell'epidemia fino a una pompa dell'acqua.</p>
<footer>Image: John Snow cholera map, Wikipedia.</footer>
</section>

ackground" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;https://images.unsplash.com/photo-1712697235813-67e2567b3eed?w=1600&quot;);"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="21" data-paginate="true" data-footer="Gualandi, B., Pareschi, L., &amp; Peroni, S. (2023). What do we mean by “data”? A proposed classification of data types in the arts and humanities. *Journal of Documentation*, *79*(7), 51–71. https://doi.org/10.1108/JD-07-2022-0146 Image: Unsplash. &lt;a href=&quot;https://unsplash.com/photos/a-drawing-of-a-map-of-a-city-9ukqHb3KrEw&quot; target=&quot;_blank&quot;&gt;Source&lt;/a&gt;." data-theme="r7groxpkkcsfv281ok7aknbrnulalqkqisv0xhioyb" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--footer:Gualandi, B., Pareschi, L., &amp; Peroni, S. (2023). What do we mean by “data”? A proposed classification of data types in the arts and humanities. *Journal of Documentation*, *79*(7), 51–71. https://doi.org/10.1108/JD-07-2022-0146 Image: Unsplash. &lt;a href=&quot;https://unsplash.com/photos/a-drawing-of-a-map-of-a-city-9ukqHb3KrEw&quot; target=&quot;_blank&quot;&gt;Source&lt;/a&gt;.;--theme:r7groxpkkcsfv281ok7aknbrnulalqkqisv0xhioyb;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="33" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="cosa-intendiamo-con-dati">Cosa intendiamo con <em>dati</em>?</h3>
<p>Nell’immaginario comune i dati sono legati al digitale, ma hanno radici ben più profonde: si tratta di un <strong>dato</strong> (<em>datum</em>, participio passato di <em>dare</em>), <em>qualcosa che viene dato</em> dalla natura all'osservatore.</p>
<p>Da sempre sono stati usati per &quot;provare&quot;, &quot;misurare&quot;, &quot;fattualizzare&quot; qualcosa (spesso un argomento).</p>
<p>Possibile tipi: numeri; statistiche; fonti; fatti; eventi storici; interpretazioni; media; posizione; abbitudini; e ?</p>

<h3 id="non-%C3%A8-cos%C3%AC-semplice">Non è così semplice...</h3>
<p>Spesso si dice che i dati siano indipendenti dall'osservatore, ovvero che siano neutri.</p>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> I <strong>dati non sono neutri</strong>, oggettivi, ed estranei a processi di intervento umano.</p>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Un dato non esiste di per sé, ma <em>viene generato</em> e quindi <em>interpretato</em>.</p>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Ciò che è considerabile dato <strong>dipende da chi lo usa, da come lo usa, e per quale scopo</strong>.</p>
<footer>Klein, L. F. (2013). The Image of Absence: Archival Silence, Data Visualization, and James Hemings. <em>American Literature</em>, <em>85</em>(4). <a href="https://doi.org/10.1215/00029831-2367310">https://doi.org/10.1215/00029831-2367310</a> <a href="https://spring2020-networks.designforthe.net/content/6-library/3-image-of-absence/lauren-klein-image-of-absence.pdf" target="_blank">PDF</a>. Image: Lauren F. Klein.</footer>
</section>

pit-pagination-total="33" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;https://arxiv.org/html/2201.12123v1/examples.JPG&quot;);"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="23" data-paginate="true" data-footer="Ciston, S., Ananny, M., &amp; Crawford, K. (2023). *A critical field guide for working with machine learning datasets*. Knowing Machines project. https://knowingmachines.org/critical-field-guide Image: DELAUNAY dataset sample. &lt;a href=&quot;https://doi.org/10.48550/arXiv.2201.12123&quot; target=&quot;_blank&quot;&gt;Source&lt;/a&gt;." data-theme="r7groxpkkcsfv281ok7aknbrnulalqkqisv0xhioyb" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--footer:Ciston, S., Ananny, M., &amp; Crawford, K. (2023). *A critical field guide for working with machine learning datasets*. Knowing Machines project. https://knowingmachines.org/critical-field-guide Image: DELAUNAY dataset sample. &lt;a href=&quot;https://doi.org/10.48550/arXiv.2201.12123&quot; target=&quot;_blank&quot;&gt;Source&lt;/a&gt;.;--theme:r7groxpkkcsfv281ok7aknbrnulalqkqisv0xhioyb;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="33" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="i-dati-sono-raccolti-in-dataset">I dati sono raccolti in <em>dataset</em></h3>
<p><img class="emoji" draggable="false" alt="➡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/27a1.svg" data-marp-twemoji=""/> Un <strong>dataset</strong> può essere costituito da qualsiasi tipo di dati raccolti, organizzati e correlati tra loro.</p>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> <strong>Riflette le circostanze che hanno portato alla sua creazione e gestione</strong> (strumenti, limiti, bias, responsabilità).</p>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Oggi i dataset <strong>hanno un impatto diretto sulla nostra vita</strong>: accesso al lavoro, ai diritti, alla libertà di movimento, nonché sul modo in cui i sistemi ti percepiscono (monitoraggio).</p>

<h3 id="dati-umanistici">Dati umanistici</h3>
<p>Nell'ambito umanistico i dati rivestono oggi <strong>un ruolo centrale</strong> nel modo in cui concepiamo, creiamo e interagiamo con oggetti e progetti.</p>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Dati servono per organizzare una collezione bibliografica, realizzare una mostra, analizzare l'opera di un artista, ecc.</p>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Nel lungo periodo, i dati possono essere conservati da musei, archivi e gallerie nazionali, diventando parte del patrimonio storico.</p>
<footer>Image: ESRC cassette collection, Me!</footer>
</section>

<h3 id="dati-umanistici-1">Dati umanistici</h3>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Il modo in cui il linguaggio viene usato nelle discipline umanistiche tende ad essere ermetico, individualista, ambiguo.</p>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> I dati umanistici sono spesso non accessibili a causa di licenze troppo stringenti.</p>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> I dati umanistici sono complessi e raramente documentati nell'ottica di una loro gestione adeguata.</p>

ontainer="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;https://dataedo-website.s3.amazonaws.com/cartoon/data_metadata_12.png?1691677492&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="26" data-paginate="true" data-footer="Andersson, L., Huvila, I., &amp; Sköld, O. (2024). An Introduction to Paradata. In *Perspectives on Paradata: Research and Practice of Documenting Process Knowledge* (pp. 1–14). Springer International Publishing. https://doi.org/10.1007/978-3-031-53946-6_1" data-theme="r7groxpkkcsfv281ok7aknbrnulalqkqisv0xhioyb" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--footer:Andersson, L., Huvila, I., &amp; Sköld, O. (2024). An Introduction to Paradata. In *Perspectives on Paradata: Research and Practice of Documenting Process Knowledge* (pp. 1–14). Springer International Publishing. https://doi.org/10.1007/978-3-031-53946-6_1;--theme:r7groxpkkcsfv281ok7aknbrnulalqkqisv0xhioyb;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="33" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="il-contesto-%C3%A8-importante">Il contesto è importante</h3>
<p>Nelle discipline umanistiche tendiamo ad avere <em>dati descrittivi e interpretativi di altri dati</em>: per descrivere opere culturali, eventi, collezioni bibliografiche lavoriamo più che altro sulle relazioni e i contesti (sociali, geografici, storici, umani).</p>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> In questa prospettiva, un ruolo fondamentale è svolto dai <strong>metadati</strong> che documentano <em>in maniera strutturata</em> i <em>chi</em>, i <em>cosa</em>, i <em>come</em>, i <em>quando</em>, i <em>dove</em>, i <em>perché</em> dei dati.</p>
<footer>Andersson, L., Huvila, I., &amp; Sköld, O. (2024). An Introduction to Paradata. In <em>Perspectives on Paradata: Research and Practice of Documenting Process Knowledge</em> (pp. 1–14). Springer International Publishing. <a href="https://doi.org/10.1007/978-3-031-53946-6_1">https://doi.org/10.1007/978-3-031-53946-6_1</a></footer>
</section>

<h3 id="i-metadati-di-un-oggetto">I metadati di un oggetto</h3>
<p>Ogni volta che viene scattata una foto con un dispositivo digitale, dei <em>metadati</em> vengono creati automaticamente, come:</p>
<ul>
<li data-marpit-fragment="1">Data di creazione;</li>
<li data-marpit-fragment="2">Nome del file;</li>
<li data-marpit-fragment="3">Impostazioni del dispositivo;</li>
<li data-marpit-fragment="4">Geolocalizzazione.</li>
</ul>
<footer>Image: Dataedo.com.</footer>

und-split:50%;" data-marpit-pagination-total="33" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">

<h3 id="dati-su-dati">Dati su dati</h3>
<p><img class="emoji" draggable="false" alt="➡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/27a1.svg" data-marp-twemoji=""/> I <strong>metadati</strong> sono <em>dati che descrivono un oggetto informativo e ne documentano alcune caratteristiche</em>.</p>
<p>Esempi di metadati includono l'autore di un libro, il contenuto testuale, la data di pubblicazione, e così via.</p>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> I metadati possono essere visti come <em>l'insieme di tutto ciò che si può dire su un dato (oggetto informativo) in un determinato momento, a qualsiasi livello di aggregazione</em>.</p>
<p><img class="emoji" draggable="false" alt="👉" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f449.svg" data-marp-twemoji=""/> Ritorneremo su tutto questo per approfondire all'inizio della seconda parte del corso (lezione 5).</p>

-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="left">
<h3 id="practical-exercises">Practical exercises</h3>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Lo scopo di questi esercizi è quello di farvi riflettere su ciò di cui stiamo parlando. <strong>Non si tratta di un test</strong>.</p>
<p><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/> Conosci già un progetto DH? Se sì, potresti descriverlo in una frase?<br />
<img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/32-20e3.svg" data-marp-twemoji=""/> Quali valori ritieni importanti per il lavoro che svolgi o che vorresti svolgere?<br />

<h3 id="practical-exercises-1">Practical exercises</h3>
<p>Vorrei suggerirvi la seguente attività da svolgere durante questo corso. È del tutto facoltativa, ma ve la consiglio come strumento per aiutarvi a riflettere su tutto ciò che tratteremo e impareremo.</p>
<p><strong>Tenete un diario di idee e riflessioni</strong> che potrete utilizzare per il progetto (e magari anche per altri corsi). Può trattarsi semplicemente di un documento sul vostro computer, su un servizio cloud o anche solo di una nota sul vostro telefono o tablet.</p>
<p>Può includere: ciò che avete imparato; idee con cui siete d’accordo o in disaccordo; attività svolte e difficoltà o successi riscontrati durante il lavoro pratico che faremo.</p>
<p>Se non siete sicuri di come procedere, sarò lieto di discuterne, in classe o privatamente via e-mail.</p>
