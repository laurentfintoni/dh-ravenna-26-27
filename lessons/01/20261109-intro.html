<h3 id="cera-una-volta-unepidemia-di-colera">C'era una volta un'epidemia di colera...</h3>
<p>1854, quartiere di Soho, Londra.</p>
<p>Un’epidemia di colera causa decine di morti in pochi giorni.</p>
<p>John Snow, un medico, decide di mappare i casi, identificando ogni evento di contagio e segnalandolo su una mappa del quartiere.</p>
<p>Ciò permette di rintracciare la fonte dell'epidemia fino a una pompa dell'acqua.</p>
<footer>Drucker, J. (2011). Humanities Approaches to Graphical Display. Digital Humanities Quarterly, 5(1). <a href="https://www.proquest.com/scholarly-journals/humanities-approaches-graphical-display/docview/2555208513/se-2">https://www.proquest.com/scholarly-journals/humanities-approaches-graphical-display/docview/2555208513/se-2</a></footer>
</section>

<h3 id="cosa-intendiamo-con-dati">Cosa intendiamo con <em>dati</em>?</h3>
<p>Nell’immaginario comune i dati sono legati al digitale, ma hanno radici ben più profonde: da sempre rappresentano qualcosa che usiamo per &quot;provare&quot;, &quot;misurare&quot;, &quot;fattualizzare&quot; qualcosa.</p>
<ul>
<li data-marpit-fragment="1">Numeri e statistiche?</li>
<li data-marpit-fragment="2">Fonti primarie / secondarie?</li>
<li data-marpit-fragment="3">Fatti?</li>
<li data-marpit-fragment="4">Eventi storici?</li>
<li data-marpit-fragment="5">Interpretazioni?</li>
<li data-marpit-fragment="6">Testi / immagini / video / ...?</li>
</ul>

<h3 id="qualcosa-che-viene-dato">Qualcosa che viene &quot;dato&quot;?</h3>
<p>Il numero di nuovi romanzi pubblicati da un singolo editore tra il 1855 e il 1862.</p>
<p>Si tratta di un <strong>dato</strong> (<em>datum</em>, participio passato di <em>dare</em>): <em>qualcosa che viene dato</em> dalla natura all'osservatore.</p>
<p>Si tratta di un approccio <em>realista</em>: secondo questa visione, i dati sono indipendenti dall'osservatore.</p>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> I dati sono neutrali, oggettivi, ed estranei a processi di intervento umano?</p>
<footer>Drucker, J. (2011). Humanities Approaches to Graphical Display. Digital Humanities Quarterly, 5(1). <a href="https://www.proquest.com/scholarly-journals/humanities-approaches-graphical-display/docview/2555208513/se-2">https://www.proquest.com/scholarly-journals/humanities-approaches-graphical-display/docview/2555208513/se-2</a></footer>
</section>

anced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/0103.png&quot;);background-size:contain;"><figcaption>&quot;Drucker, J. (2011). Humanities Approaches to Graphical Display. Digital Humanities Quarterly, 5(1). https://www.proquest.com/scholarly-journals/humanities-approaches-graphical-display/docview/2555208513/se-2&quot;</figcaption></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="6" data-paginate="true" data-footer="Leonelli, S. (2016). Data-Centric Biology: A Philosophical Study. University of Chicago Press. &lt;a href=&quot;https://doi.org/10.7208/chicago/9780226416502.001.0001&quot;&gt;https://doi.org/10.7208/chicago/9780226416502.001.0001&lt;/a&gt;" data-theme="50kukp4o9b34973j0cdjwu2rswir41674maviuudrpd" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--footer:Leonelli, S. (2016). Data-Centric Biology: A Philosophical Study. University of Chicago Press. &lt;a href=&quot;https://doi.org/10.7208/chicago/9780226416502.001.0001&quot;&gt;https://doi.org/10.7208/chicago/9780226416502.001.0001&lt;/a&gt;;--theme:50kukp4o9b34973j0cdjwu2rswir41674maviuudrpd;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="33" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="non-%C3%A8-cos%C3%AC-semplice">Non è così semplice...</h3>
<p>La comparsa nel 1855 di quattordici romanzi dipende da molteplici eventi che si sovrappongono e si influenzano a vicenda: stesura, acquisizione, revisione, pre-stampa e pubblicazione.</p>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Un dato non esiste di per sé, ma <em>esiste nel momento in cui viene generato, raccolto e/o interpretato</em> attraverso strumenti e sforzi umani.</p>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Ciò che è considerabile <em>dato</em> dipende da chi lo usa, da come lo usa, e per quale scopo.</p>
<footer>Leonelli, S. (2016). Data-Centric Biology: A Philosophical Study. University of Chicago Press. <a href="https://doi.org/10.7208/chicago/9780226416502.001.0001">https://doi.org/10.7208/chicago/9780226416502.001.0001</a></footer>
</section>

<h3 id="un-dato-%C3%A8-qualcosa-che-viene-preso">Un dato è &quot;qualcosa che viene preso&quot;</h3>
<p><img class="emoji" draggable="false" alt="➡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/27a1.svg" data-marp-twemoji=""/> I <strong>dati</strong> sono <em>rappresentazioni di entità usate come prova di fenomeni per scopi di ricerca, studio, o altre pratiche di creazione della conoscenza</em>.</p>
<p>Queste entità possono essere intersoggettive o soggettive; fisiche o concettuali; persistenti o effimere; personali o pubbliche; esplicite o implicite.</p>
<p>L'importante è la loro natura di <em>evidenza</em> per spiegare, dimostrare, usare qualcosa.</p>

</section>

<h3 id="i-dati-sono-raccolti-in-dataset">I dati sono raccolti in <em>dataset</em></h3>
<p><img class="emoji" draggable="false" alt="➡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/27a1.svg" data-marp-twemoji=""/> Un <strong>dataset</strong> è <em>una raccolta di dati organizzati secondo criteri precisi per sostanziare una particolare analisi, interpretazione o argomento</em>.</p>
<p>Quando parliamo di dati, in realtà stiamo parlando di dataset!</p>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Riflette le circostanze che hanno portato alla sua creazione e gestione (strumenti, limiti, bias, responsabilità…).</p>

<h3 id="perch%C3%A9-%C3%A8-importante-parlare-di-dati-anche-in-ambito-umanistico">Perché è importante parlare di dati anche in ambito umanistico?</h3>
<p>I dati possono essere utilizzati per scrivere un articolo scientifico, organizzare una collezione bibliografica, realizzare una mostra.</p>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Nel breve termine, altri persone potrebbero essere interessate a <strong>riutilizzare</strong> i nostri dati o a <strong>collaborare</strong> su nuovi progetti.</p>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Nel lungo periodo, i dati possono essere <strong>conservati</strong> da musei, archivi e gallerie nazionali, diventando parte del patrimonio storico a disposizione delle generazioni future.</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="50kukp4o9b34973j0cdjwu2rswir41674maviuudrpd" lang="en-US" data-marpit-pagination="10" style="" data-marpit-pagination-total="33" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-footer="Andersson, L., Huvila, I., &amp; Sköld, O. (2024). An Introduction to Paradata. In &quot;Perspectives on Paradata: Research and Practice of Documenting Process Knowledge&quot; (pp. 1-14). Cham: Springer International Publishing. https://doi.org/10.1007/978-3-031-53946-6_1" data-theme="50kukp4o9b34973j0cdjwu2rswir41674maviuudrpd" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--footer:Andersson, L., Huvila, I., &amp; Sköld, O. (2024). An Introduction to Paradata. In &quot;Perspectives on Paradata: Research and Practice of Documenting Process Knowledge&quot; (pp. 1-14). Cham: Springer International Publishing. https://doi.org/10.1007/978-3-031-53946-6_1;--theme:50kukp4o9b34973j0cdjwu2rswir41674maviuudrpd;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="33" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/0108.png&quot;);background-size:contain;"><figcaption>&quot;&quot;</figcaption></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="11" data-paginate="true" data-footer="Andersson, L., Huvila, I., &amp; Sköld, O. (2024). An Introduction to Paradata. In &quot;Perspectives on Paradata: Research and Practice of Documenting Process Knowledge&quot; (pp. 1-14). Cham: Springer International Publishing. https://doi.org/10.1007/978-3-031-53946-6_1" data-theme="50kukp4o9b34973j0cdjwu2rswir41674maviuudrpd" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--footer:Andersson, L., Huvila, I., &amp; Sköld, O. (2024). An Introduction to Paradata. In &quot;Perspectives on Paradata: Research and Practice of Documenting Process Knowledge&quot; (pp. 1-14). Cham: Springer International Publishing. https://doi.org/10.1007/978-3-031-53946-6_1;--theme:50kukp4o9b34973j0cdjwu2rswir41674maviuudrpd;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="33" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="spesso-il-contesto-%C3%A8-pi%C3%B9-importante">Spesso il contesto è più importante</h3>
<p>Nelle discipline umanistiche tendiamo ad avere <em>dati descrittivi e interpretativi di altri dati</em>: per descrivere opere culturali, eventi, collezioni bibliografiche lavoriamo più che altro sulle relazioni e i contesti (sociali, geografici, storici, umani).</p>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> In questa prospettiva, un ruolo fondamentale è svolto dai <strong>metadati</strong> che documentano <em>in maniera strutturata</em> i <em>chi</em>, i <em>cosa</em>, i <em>come</em>, i <em>quando</em>, i <em>dove</em>, i <em>perché</em> dei dati.</p>
<footer>Andersson, L., Huvila, I., &amp; Sköld, O. (2024). An Introduction to Paradata. In &quot;Perspectives on Paradata: Research and Practice of Documenting Process Knowledge&quot; (pp. 1-14). Cham: Springer International Publishing. <a href="https://doi.org/10.1007/978-3-031-53946-6_1">https://doi.org/10.1007/978-3-031-53946-6_1</a></footer>
</section>

<h3 id="i-metadati-di-un-oggetto">I metadati di un oggetto</h3>
<p>Ogni volta che viene scattata una foto con un dispositivo digitale, dei <em>metadati</em> vengono creati automaticamente, come:</p>
<ul>
<li data-marpit-fragment="1">Data di creazione;</li>
<li data-marpit-fragment="2">Nome del file;</li>
<li data-marpit-fragment="3">Impostazioni del dispositivo;</li>
<li data-marpit-fragment="4">Geolocalizzazione.</li>
</ul>
<p>Anche un libro è ricco di metadati visibili sulla copertina e nel frontespizio, come:</p>
<ul>
<li data-marpit-fragment="5">Titolo;</li>
<li data-marpit-fragment="6">Autore;</li>
<li data-marpit-fragment="7">Editore.</li>
</ul>
</section>

<h3 id="dati-su-dati">Dati su dati</h3>
<p><img class="emoji" draggable="false" alt="➡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/27a1.svg" data-marp-twemoji=""/> I <strong>metadati</strong> sono <em>dati che descrivono un oggetto informativo e ne documentano alcune caratteristiche</em>.</p>
<p>Esempi di metadati includono l'autore di un libro, il contenuto testuale, la data di pubblicazione, e così via.</p>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> I metadati possono essere visti come <em>l'insieme di tutto ciò che si può dire su un dato (oggetto informativo) in un determinato momento, a qualsiasi livello di aggregazione</em>.</p>

<h3 id="i-metadati-possono-riferirsi-a-tante-cose">I metadati possono <em>riferirsi a</em> tante cose</h3>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> I metadati costituiscono <em>una forma di <strong>documentazione</strong></em> (di solito strutturata) che descrive o rappresenta le caratteristiche di un oggetto.</p>
<p><img class="emoji" draggable="false" alt="🔎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50e.svg" data-marp-twemoji=""/> Quindi, possono essere usati per descrivere tanto gli oggetti <em>fisici</em> (per esempio, frammenti di vasi, reperti archeologici, quadri, libri, persone, ecc.), quanto gli oggetti <em>digitali</em> (per esempio, software, foto, dataset, videogiochi, modelli 3D, ecc.).</p>

e></div></section></foreignObject><foreignObject width="50%" height="720"><section id="15" data-paginate="true" data-footer="Australian Research Data Commons (ARDC). (2020). ARDC Metadata Guide. Zenodo. &lt;a href=&quot;https://doi.org/10.5281/zenodo.6459832&quot;&gt;https://doi.org/10.5281/zenodo.6459832&lt;/a&gt;" data-theme="50kukp4o9b34973j0cdjwu2rswir41674maviuudrpd" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--footer:Australian Research Data Commons (ARDC). (2020). ARDC Metadata Guide. Zenodo. &lt;a href=&quot;https://doi.org/10.5281/zenodo.6459832&quot;&gt;https://doi.org/10.5281/zenodo.6459832&lt;/a&gt;;--theme:50kukp4o9b34973j0cdjwu2rswir41674maviuudrpd;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="33" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="i-metadati-possono-essere-tante-cose">I metadati possono <em>essere</em> tante cose</h3>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> I metadati possono assumere molte <em>forme</em> diverse.</p>
<p><img class="emoji" draggable="false" alt="🔎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50e.svg" data-marp-twemoji=""/> A partire da semplice <em>testo libero</em> (per esempio, l'etichetta di un'opera d'arte esposta in un museo), pensato per un utilizzatore umano, i metadati possono esistere anche sotto forma di contenuto codificato in <em>un formato altamente strutturato, standardizzato e comprensibile dalle macchine</em> (per esempio, un file <a href="https://it.wikipedia.org/wiki/ISO_2709">MARC</a>).</p>
<footer>Australian Research Data Commons (ARDC). (2020). ARDC Metadata Guide. Zenodo. <a href="https://doi.org/10.5281/zenodo.6459832">https://doi.org/10.5281/zenodo.6459832</a></footer>
</section>

e></div></section></foreignObject><foreignObject width="50%" height="720"><section id="16" data-paginate="true" data-footer="Australian Research Data Commons (ARDC). (2020). ARDC Metadata Guide. Zenodo. &lt;a href=&quot;https://doi.org/10.5281/zenodo.6459832&quot;&gt;https://doi.org/10.5281/zenodo.6459832&lt;/a&gt;" data-theme="50kukp4o9b34973j0cdjwu2rswir41674maviuudrpd" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--footer:Australian Research Data Commons (ARDC). (2020). ARDC Metadata Guide. Zenodo. &lt;a href=&quot;https://doi.org/10.5281/zenodo.6459832&quot;&gt;https://doi.org/10.5281/zenodo.6459832&lt;/a&gt;;--theme:50kukp4o9b34973j0cdjwu2rswir41674maviuudrpd;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="33" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="i-metadati-sono-sempre-associati-ai-dati-che-descrivono">I metadati sono sempre associati ai dati che descrivono</h3>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> I metadati <em>accompagnano ciò che descrivono</em> in vari modi.</p>
<p><img class="emoji" draggable="false" alt="🔎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50e.svg" data-marp-twemoji=""/> Possono essere presenti direttamente <em>nei dati stessi</em> (per esempio, un file PDF o un'immagine digitale), oppure possono essere registrati <em>in oggetti separati collegati</em> in qualche maniera ai dati che descrivono (per esempio, file di testo, fogli di calcolo, ma anche una scheda di catalogo o l'etichetta di un'opera esposta in un museo).</p>
<footer>Australian Research Data Commons (ARDC). (2020). ARDC Metadata Guide. Zenodo. <a href="https://doi.org/10.5281/zenodo.6459832">https://doi.org/10.5281/zenodo.6459832</a></footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-footer="Australian Research Data Commons (ARDC). (2020). ARDC Metadata Guide. Zenodo. &lt;a href=&quot;https://doi.org/10.5281/zenodo.6459832&quot;&gt;https://doi.org/10.5281/zenodo.6459832&lt;/a&gt;" data-theme="50kukp4o9b34973j0cdjwu2rswir41674maviuudrpd" lang="en-US" data-marpit-pagination="16" style="" data-marpit-pagination-total="33" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-marpit-fragments="3" data-paginate="true" data-footer="Australian Research Data Commons (ARDC). (2020). ARDC Metadata Guide. Zenodo. &lt;a href=&quot;https://doi.org/10.5281/zenodo.6459832&quot;&gt;https://doi.org/10.5281/zenodo.6459832&lt;/a&gt;" data-theme="50kukp4o9b34973j0cdjwu2rswir41674maviuudrpd" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--footer:Australian Research Data Commons (ARDC). (2020). ARDC Metadata Guide. Zenodo. &lt;a href=&quot;https://doi.org/10.5281/zenodo.6459832&quot;&gt;https://doi.org/10.5281/zenodo.6459832&lt;/a&gt;;--theme:50kukp4o9b34973j0cdjwu2rswir41674maviuudrpd;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="33" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/0115.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="17" data-marpit-fragments="3" data-paginate="true" data-footer="Australian Research Data Commons (ARDC). (2020). ARDC Metadata Guide. Zenodo. &lt;a href=&quot;https://doi.org/10.5281/zenodo.6459832&quot;&gt;https://doi.org/10.5281/zenodo.6459832&lt;/a&gt;" data-theme="50kukp4o9b34973j0cdjwu2rswir41674maviuudrpd" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--footer:Australian Research Data Commons (ARDC). (2020). ARDC Metadata Guide. Zenodo. &lt;a href=&quot;https://doi.org/10.5281/zenodo.6459832&quot;&gt;https://doi.org/10.5281/zenodo.6459832&lt;/a&gt;;--theme:50kukp4o9b34973j0cdjwu2rswir41674maviuudrpd;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="33" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="esistono-diversi-tipi-di-metadati">Esistono diversi tipi di metadati</h3>
<ul>
<li data-marpit-fragment="1"><strong>Descrittivi</strong>: descrivono dati usando dettagli sul contenuto che permettono a questi dati di essere rintracciabili, identificabili e selezionabili (es. <code>titolo</code>);</li>
<li data-marpit-fragment="2"><strong>Strutturali</strong>: forniscono informazioni sulla costruzione e sull'organizzazione dei dati all'interno della loro collezione (es. <code>indice</code>);</li>
<li data-marpit-fragment="3"><strong>Amministrativi</strong>: permettono la gestione dei dati nel tempo, fornendo informazioni sulle loro origini e le loro modalità di utilizzo (es. <code>licenza</code>).</li>
</ul>
<footer>Australian Research Data Commons (ARDC). (2020). ARDC Metadata Guide. Zenodo. <a href="https://doi.org/10.5281/zenodo.6459832">https://doi.org/10.5281/zenodo.6459832</a></footer>
</section>

<h3 id="anche-gli-umanisti-usano-e-producono-metadati">Anche gli umanisti usano e producono (meta)dati</h3>
<p>Ogni tipo di attività basata sulla conoscenza comporta la produzione e/o il riutilizzo di dati, anche se il termine <em>dato</em> non viene utilizzato in ogni contesto.</p>
<p><img class="emoji" draggable="false" alt="🔎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50e.svg" data-marp-twemoji=""/> Esempio: uno studente che utilizza delle fonti (primarie o secondarie) per corroborare i contenuti della propria tesi di laurea produce <em>almeno</em> una bibliografia, ovvero un insieme di dati bibliografici.</p>
<p><img class="emoji" draggable="false" alt="🔎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50e.svg" data-marp-twemoji=""/> Esempio con <a href="https://www.zotero.org/">Zotero</a>: <a href="https://www.zotero.org/zagibaru/library">[1]</a></p>
<footer>Gualandi, B., Pareschi, L., &amp; Peroni, S. (2023). What do we mean by “data”? A proposed classification of data types in the arts and humanities. Journal of Documentation, 79(7), 51-71. <a href="https://doi.org/10.1108/JD-07-2022-0146">https://doi.org/10.1108/JD-07-2022-0146</a></footer>
</section>

<h3 id="le-discipline-umanistiche-sono-dominate-da-paradigmi-tradizionali">Le discipline umanistiche sono dominate da paradigmi tradizionali</h3>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Il modo in cui il linguaggio viene usato nelle discipline umanistiche tende ad essere ermetico, individualista, ambiguo.</p>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> I dati umanistici sono spesso non accessibili a causa di licenze troppo stringenti.</p>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> I dati umanistici sono complessi e raramente documentati nell'ottica di una loro gestione adeguata.</p>

<h3 id="un-nuovo-paradigma">Un nuovo paradigma</h3>
<p><img class="emoji" draggable="false" alt="➡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/27a1.svg" data-marp-twemoji=""/> Col termine <strong>Digital Humanities</strong> (DH) ci si riferisce ad <em>un insieme di discipline in rapida espansione che esplora, sviluppa e applica metodi e strumenti digitali alle scienze umanistiche</em>.</p>
<p>Spesso vengono utilizzate tecnologie digitali per esplorare domande di ricerca in ambito umanistico.</p>
<p>In altri casi, vengono formulare domande di ricerca di natura umanistica su questioni riguardanti tecnologie digitali e il loro impatto sulla società.</p>
<footer>Fitzpatrick, K. (2012). The humanities, done digitally. Debates in the digital humanities, 12-15. <a href="https://doi.org/10.5749/minnesota/9780816677948.003.0002">https://doi.org/10.5749/minnesota/9780816677948.003.0002</a></footer>
</section>

<h3 id="le-diverse-prospettive-delle-dh">Le diverse prospettive delle DH</h3>
<p><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/> Le DH nascono da una prospettiva <em>testuale</em>, focalizzata sulla digitalizzazione di fonti fisiche e sull'utilizzo di strumenti computazionali per organizzare ed analizzare materiali digitalizzati.</p>
<p><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/32-20e3.svg" data-marp-twemoji=""/> In seguito, le tipologie di fonti si moltiplicano (immagini, audio, video, ecc.), entrano in gioco anche i materiali nativamente digitali, e cresce un maggiore interesse verso l'epistemiologia (il <em>come</em>).</p>
<p><img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/33-20e3.svg" data-marp-twemoji=""/> Ora, sta aumentando l'interesse verso l'impatto che la <em>digitalizzazione</em>, la <em>dataficazione</em>, l'<em>algoritmizzazione</em> e l'<em>AI</em> stanno avendo sulla società e sulla cultura.</p>
</section>

<h3 id="concetti-computazionali-chiave">Concetti computazionali chiave</h3>
<ul>
<li data-marpit-fragment="1"><strong>Decomposizione</strong>: dividere un problema in parti più piccole e gestibili;</li>
<li data-marpit-fragment="2"><strong>Riconoscimento di pattern</strong>: cercare somiglianze e tendenze nei componenti del problema;</li>
<li data-marpit-fragment="3"><strong>Astrazione</strong>: focalizzarsi solo sulle informazioni rilevanti, rimuovendo dettagli non necessari;</li>
<li data-marpit-fragment="4"><strong>Sviluppo di algoritmi</strong>: sviluppare una soluzione sequenziale al problema.</li>
</ul>

<h3 id="il-tempo-dei-macroscopi">Il tempo dei <em>macroscopi</em></h3>
<p><img class="emoji" draggable="false" alt="➡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/27a1.svg" data-marp-twemoji=""/> Un <strong>macroscopio</strong> è <em>un dispositivo (fisico, digitale, concettuale) che fornisce una visione d'insieme su qualcosa</em>, sintetizzando elementi in relazione l'uno con l'altro e individuando pattern, tendenze, casi particolari, eccezioni, dettagli.</p>
<p>Ci permette di osservare ciò che è troppo grande, lento, o complesso per essere compreso dal solo occhio umano.</p>
<p>Può essere un dataset, un servizio, un software, una metodologia...</p>
<footer>Börner, K. (2011). Plug-and-play macroscopes. Communications of the ACM, 54(3), 60-69. <a href="https://doi.org/10.1145/1897852.1897871">https://doi.org/10.1145/1897852.1897871</a></footer>
