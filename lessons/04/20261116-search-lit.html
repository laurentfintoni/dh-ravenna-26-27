<h3 id="cera-una-volta">C'era una volta...</h3>
<p>Le biblioteche! Luoghi di conoscenza e di comunità.</p>
<p>Queste biblioteche sono gestite da persone il cui compito è valutare le richieste degli utenti e aiutarli a trovare i libri, o altre risorse, di cui hanno bisogno.</p>
<p>Non è un sistema perfetto, ma è un buon sistema che ha superato la prova del tempo.</p>
<p>Finché non è arrivato un nuovo tipo di macchina.</p>
<footer>Image: Unsplash. <a href="https://unsplash.com/photos/two-women-talking-in-the-library-gm09x1AgA1A" target="_blank">Source</a>.</footer>

<h3 id="c%C3%A8-oggi">C'è oggi...</h3>
<p>C'è un piccolo problema.</p>
<p>Ai bibliotecari viene chiesto di trovare libri che non esistono. Questi libri, così come altre fonti, sono inventati dalla GenAI.</p>
<p>Chi usa la GenAI per cercare informazioni tende a credere che la macchina “abbia” autorità e potrebbe non accettare l’idea che possa sbagliarsi.</p>
<p>Le fonti hanno sempre contenuto menzogne, ma ora queste sono più frequenti e potenzialmente più pericolose.</p>

<h6 id="part-1">Part 1</h6>
<h1 id="research-literacy"><strong>research</strong> literacy</h1>
<h2 id="or-why-knowing-how-to-find-matters-as-much-as-finding">(or why knowing how to find matters as much as finding)</h2>
</section>

<h3 id="search-vs-research">Search vs Research</h3>
<blockquote>
<p>&quot;Searching is the preliminary stage of looking for something [...] Research proper involves analysis, evaluation, and a new way of approaching a problem.&quot; — Bishop (2023)</p>
</blockquote>
<p>È una distinzione semplice ma importante. Il modo in cui si effettua la ricerca è spesso influenzato dalle tecnologie con cui siamo cresciuti. Si deve adattare. Un sistema che un tempo davi per scontato potrebbe non funzionare più come desideri o di cui hai bisogno.</p>
<p>A volte, adattarsi può anche significare fare un passo indietro, per abbracciare modi di fare “più semplici”: utilizzare una biblioteca; utilizzare un browser che elimina l’intelligenza artificiale e la pubblicità, ecc.</p>
<footer>Bishop, C. (2023). Information Overload. <em>Artforum</em>. <a href="https://www.artforum.com/features/claire-bishop-on-the-superabundance-of-research-based-art-252571/">https://www.artforum.com/features/claire-bishop-on-the-superabundance-of-research-based-art-252571/</a></footer>
</section>

<h3 id="research-literacy-1">Research literacy</h3>
<blockquote>
<p>“Research literacy is a set of <strong>interdisciplinary, transferable competencies</strong> that help individuals determine and diminish knowledge gaps. [...] Research literacy is the sum of the attributes required of lifelong learners.” — Grinnell College Libraries (n.d.)</p>
</blockquote>
<p>Nel mondo accademico ciò significa rispondere a una domanda di ricerca o a un’ipotesi avvalendosi di ricerche, risultati e approfondimenti già esistenti. Nel mondo reale significa essere in grado di risolvere un problema ampliando le proprie conoscenze. Si tratta di un percorso che dura tutta la vita.</p>

<h3 id="information-literacy">Information literacy</h3>
<p>Pietra miliare fondamentale della research literacy. Ecco i 6 principi su cui si fonda:</p>
<ul>
<li>L’autorità è costruita e contestuale</li>
<li>La creazione di informazioni come processo</li>
<li>L’informazione ha valore</li>
<li>La ricerca come indagine</li>
<li>La ricerca accademica come dialogo</li>
<li>La ricerca come esplorazione strategica</li>
</ul>

<h3 id="information-literacy-1">Information literacy</h3>
<p><em>L'autorità è contestuale</em> allo stesso modo in cui <a href="https://laurentfintoni.github.io/dh-ravenna-26-27/lessons/03/20261113-workshop01.html" target="_blank">la conoscenza è situata</a>. Non bisogna mai fidarsi ciecamente di una fonte.</p>
<p><em>L’informazione ha valore</em> perché oggi spesso consiste in dati e metadati relativi al mondo (incluso noi!).</p>
<p>Si dever valutare i fonti, risultati, ecc.</p>
<p>Per una guida in italiano su tutto questo, consultate <a href="https://www.aib.it/repertori/information-literacy-strumenti-di-lavoro/" target="_blank">Information Literacy – Strumenti di lavoro</a> dell’AIB.</p>

<h3 id="how-to-evaluate-sources">How to evaluate sources?</h3>
<ul>
<li data-marpit-fragment="1">
<p><img class="emoji" draggable="false" alt="🤔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f914.svg" data-marp-twemoji=""/> Se bisogna valutare una fonte, quali domande bisogna porsi?</p>
</li>
<li data-marpit-fragment="2">
<p>Di che fonte si tratta? Quali sono le affermazioni riportate?</p>
</li>
<li data-marpit-fragment="3">
<p>Chi è l’autore? Quali sono le sue credenziali?</p>
</li>
<li data-marpit-fragment="4">
<p>A quando risale? È ancora attuale?</p>
</li>
<li data-marpit-fragment="5">
<p>Valutare una fonte non è sempre facile, ma dedicarci anche solo qualche minuto può aiutare ad assicurarsi di non commettere errori.</p>
</li>
</ul>

<h3 id="tips-tricks-pitfalls">Tips, Tricks, Pitfalls</h3>
<h4 id="operators">Operators</h4>
<p>Gli operatori di ricerca sono comandi o caratteri che consentono di affinare la ricerca. Il più comune è <code>“la mia query”</code>, dove le virgolette <code>“”</code> indicano al motore di ricerca di cercare una corrispondenza esatta. Google mantiene un <a href="https://support.google.com/websearch/answer/2466433?hl=en" target="_blank">elenco degli operatori accettati</a> e la maggior parte dei motori di ricerca o delle funzioni li segue (o ne utilizza di simili).</p>
<h4 id="ads--sponcon">Ads &amp; Sponcon</h4>
<p>Oggi la maggior parte dei motori di ricerca combina risultati “organici” con risultati sponsorizzati (annunci pubblicitari). Allo stesso tempo, alcuni contenuti online sono in realtà annunci pubblicitari mascherati da qualcos’altro.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="3q1utf7pf3bu9oh609stapfenmhd6hogo1pq9rw1syz5" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:3q1utf7pf3bu9oh609stapfenmhd6hogo1pq9rw1syz5;" data-marpit-pagination-total="31" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}">
<h3 id="tips-tricks-pitfalls-1">Tips, Tricks, Pitfalls</h3>
<h4 id="personalised-results">Personalised results</h4>
<p>Se durante la ricerca avete effettuato l'accesso a un servizio come Google o Microsoft (il profilo), i risultati saranno personalizzati in base ai dati che l'azienda possiede. La stessa ricerca effettuata in un browser senza accesso potrebbe dare risultati diversi. Lo stesso vale per la posizione (indirizzo IP fornito dalla connessione, per quello si usa VPN).</p>
<h4 id="there-is-more-than-one-page">There is more than one page!</h4>
<p>È assolutamente possibile trovare ciò che si cerca anche oltre la prima pagina dei risultati.</p>
<h4 id="ai-summaries">AI summaries</h4>
<p>La genAI sintetizza i risultati principali. Controllate sempre oppure <a href="https://surnex.io/blog/non-ai-search-engine" target="_blank">utilizzate un browser dotato di controlli più rigorosi in materia di privacy e intelligenza artificiale</a>.</p>
</section>

<h3 id="sources-for-the-final-exam">Sources for the final exam</h3>
<p>Potete scegliere autonomamente la fonte dei dati per l'esame finale. Per aiutarvi, vi fornisco anche un elenco di fonti che potete consultare o da cui potete partire; tutte offrono diversi tipi di oggetti digitalizzati, tra cui mappe, testi e immagini. La lista è nelle linee guida.</p>
<p><a href="https://www.europeana.eu/it" target="_blank">Europeana</a> (EU); <a href="https://www.loc.gov/free-to-use/" target="_blank">Library of Congress</a> (US); <a href="https://www.library.universiteitleiden.nl/special-collections/collections" target="_blank">Leiden University</a> (NL); <a href="https://historica.unibo.it/home" target="_blank">AMS Historica</a> (IT); <a href="https://www.nga.gov/artworks/free-images-and-open-access" target="_blank">National Gallery of Art</a> (US); <a href="https://www.internetculturale.it/" target="_blank">Internet Culturale</a> (IT); <a href="https://alphabetica.it/web/alphabetica" target="_blank">Alphabetica</a> (IT); <a href="https://imago.regione.emilia-romagna.it/opac/.do" target="_blank">Imago</a> (IT); <a href="https://commons.wikimedia.org/wiki/Main_Page" target="_blank">Wikimedia Commons</a>; <a href="https://archive.org" target="_blank">Internet Archive</a>.</p>
<p>Parleremo dei diritti, compreso il riutilizzo, nella Lezione 07. Per ora basta sapere che la maggior parte di queste fonti ha licenze permissive. In caso di dubbio, bisogno sempre di cercare un'oggetto con una licenza aperta o di dominio pubblico.</p>
</section>

<h3 id="data-literacy-1">Data Literacy</h3>
<blockquote>
<p>“Digital humanities literacy is a combination of many literacy areas. Still, <strong>the prevalence of data in both our daily lives and in digital humanities places data literacy in a position of importance</strong>.” — Abner (2020)</p>
</blockquote>
<p>Oggi, l'information literacy si sta espandendo verso nuove forme di alfabetizzazione specifica, come la data literacy.</p>
<p>Data literacy, in senso lato, è la capacità di <strong>creare, manipolare, gestire, analizzare, comprendere e comunicare i dati in modo critico</strong>. È un modo per confrontarsi con il potere e l’impatto dei dati, i loro usi e i loro limiti.</p>

ge: Unsplash. &lt;a href=&quot;https://unsplash.com/photos/a-painting-with-a-green-circle-on-top-of-it-s2UR2Wg0Fec&quot; target=&quot;_blank&quot;&gt;Source&lt;/a&gt;." data-theme="3q1utf7pf3bu9oh609stapfenmhd6hogo1pq9rw1syz5" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--footer:Abner, K. (2020). Data Literacy as Digital Humanities Literacy: Exploration of Threshold Concepts. *dh+lib*. https://dhandlib.org/data-literacy-as-digital-humanities-literacy-exploration-of-threshold-concepts/ Image: Unsplash. &lt;a href=&quot;https://unsplash.com/photos/a-painting-with-a-green-circle-on-top-of-it-s2UR2Wg0Fec&quot; target=&quot;_blank&quot;&gt;Source&lt;/a&gt;.;--theme:3q1utf7pf3bu9oh609stapfenmhd6hogo1pq9rw1syz5;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="31" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="left">
<h3 id="data-literacy-concepts">Data Literacy concepts</h3>
<ul>
<li>I dati sono generati sia da macchine che da esseri umani.
<ul>
<li>Non sono intrinsecamente oggettivi.</li>
</ul>
</li>
<li>I dati rappresentano solo una parte della storia.
<ul>
<li>Da soli non possono fornire un quadro completo.</li>
</ul>
</li>
<li>I dati fanno parte del dibattito accademico e professionale.
<ul>
<li>Risultano di determinati processi.</li>
</ul>
</li>
</ul>

<h3 id="data-ethics">Data Ethics</h3>
<ul>
<li>Qual è la licenza per l’uso/il riutilizzo?</li>
<li>Comeperché sono stati raccolti i dati?</li>
<li>Chi ne è stato, e potrebbe ancora esserne, interessato?</li>
<li>Perché vengono condivisi i dati?</li>
<li>Come vengono descritti i dati?</li>
</ul>
<p>La scienza dei dati è sempre stata una forma di potere. Fin dall’antichità è stata utilizzata per organizzare la società.</p>
<p>Come sostiene Roopika Risam, &quot;anche se non tutto è dato, i dati sono ovunque.&quot;</p>

<h3 id="collections-as-data">Collections as data</h3>
<p><a href="https://collectionsasdata.github.io/part2whole/" target="_blank">“Collections as Data</a>” è un'iniziativa volta a promuovere la pubblicazione di collezioni digitali adatte a un utilizzo computazionale responsabile.</p>
<p>Si tratta di un quadro di riferimento che consente alle istituzioni del patrimonio culturale di riflettere su come e perché rendere le proprie collezioni disponibili al pubblico per il (ri)utilizzo.</p>
<p>Attualmente si sta lavorando su l’implementazione e l’uso responsabile.</p>

<h3 id="what-if-data-is-the-wrong-word">What if data is the wrong word?</h3>
<p>Possiamo cambiare il nostro modo di concepire i dati, riflettendo sul significato stesso del termine.</p>
<p>Nel 2011, Johanna Drucker ha sostenuto che &quot;il concetto di dati come dato di fatto deve essere ripensato attraverso una lente umanistica e definito come <strong>capta</strong>, ovvero raccolti e costruiti.&quot;</p>
<p>I dati incarnano delle scelte su cosa contare e in che modo. Sono interpretazione (come i metadati in fatto).</p>
<footer>Drucker, J. (2011). Humanities Approaches to Graphical Display. <em>Digital Humanities Quarterly</em>, <em>5</em>(1). <a href="https://dhq.digitalhumanities.org/vol/5/1/000091/000091.html">https://dhq.digitalhumanities.org/vol/5/1/000091/000091.html</a> Image: Unsplash. <a href="https://unsplash.com/photos/a-painting-with-blue-and-brown-squares-on-it-0_erDmzjMkA" target="_blank">Source</a>.</footer>

<h3 id="computational-thinking">Computational Thinking</h3>
<ul>
<li data-marpit-fragment="1"><strong>Decomposizione</strong>: dividere un problema in parti più piccole e gestibili;</li>
<li data-marpit-fragment="2"><strong>Riconoscimento di pattern</strong>: cercare somiglianze e tendenze nei componenti del problema;</li>
<li data-marpit-fragment="3"><strong>Astrazione</strong>: focalizzarsi solo sulle informazioni rilevanti, rimuovendo dettagli non necessari;</li>
<li data-marpit-fragment="4"><strong>Sviluppo di algoritmi</strong>: sviluppare una soluzione sequenziale al problema.</li>
</ul>
<footer>Lodi, M., &amp; Martini, S. (2021). Computational thinking, between Papert and Wing. <em>Science &amp; Education</em>, <em>30</em>(4), 883–908. <a href="https://doi.org/10.1007/s11191-021-00202-5">https://doi.org/10.1007/s11191-021-00202-5</a> Image: Computational thinking cornerstones, BBC. <a href="https://www.bbc.co.uk/bitesize/guides/zp92mp3/revision/1" target="_blank">Source</a>.</footer>

<h3 id="what-are-we-talking-about">What are we talking about?</h3>
<p>Proprio come si amplia l’information literacy, così si amplia anche la technological literacy. Quindi il pensiero computazionale, ma ora anche l’IA.</p>
<p>Ma cos’è l’IA?</p>
<p>Significa <strong>cose diverse per persone diverse in contesti diversi</strong>: IA generativa, LLM, apprendimento automatico, visione artificiale, sistemi di raccomandazione, tecnologia di sorveglianza, sistemi commerciali e governativi ecc.</p>

<h3 id="ai-literacy-1">AI Literacy</h3>
<p>Il problema dell' AI literacy è che questa tecnologia è in gran parte una “scatola nera”. Non sappiamo tutto ciò che accade al suo interno. Pertanto, non possiamo davvero “decifrarla” come faremmo con altre cose.</p>
<p>Utilizzare le competenze già esistenti – ricerca, dati, informazioni – con alcuni adeguamenti specifici per l’IA è una buona strada da seguire. Stanno emergendo nuovi framework incentrati sull’IA, come il recente <a href="https://ailiteracyframework.org/" target="_blank">AILit Framework</a> dell’Unione Europea.</p>

<h3 id="biases">Biases</h3>
<p>I dati di addestramento per la GenAI sono sbilanciati a favore di punti di vista di uomini bianchi europei. Una soluzione consiste nel progettare dataset più mirati per contribuire a risolvere tali squilibri.</p>
<h3 id="ai--humanities">AI &amp; humanities</h3>
<p>L'uso dell'IA nel campo umanistico richiede lo stesso approccio che abbiamo già visto: fonti, processi, presentazione.</p>
<p>I risultati devono essere interpretati nel loro contesto: storico, culturale, politico.</p>
