<h3 id="cera-una-volta">C'era una volta...</h3>
<p>Nel Medioevo, quando uno scriba terminava un manoscritto, talvolta ricorreva a quello che viene chiamato colofone – una nota riportata alla fine di un libro o di un manoscritto – per comunicare con il lettore.</p>
<p>Questi colofoni rappresentavano una delle prime forme di metadati, destinati a fornire informazioni su chi, dove e come fosse stato realizzato un manoscritto.</p>
<footer>Kwakkel, E. (2014). &quot;The Last Page of the Medieval Book&quot;. <a href="https://medievalbooks.nl/tag/colophons/">https://medievalbooks.nl/tag/colophons/</a>. Image: Scribal colophon. Source: Giulio Menna, Leiden University.</footer>

ontal"><figure style="background-image:url(&quot;img/leiden_bpl_111_i.jpg&quot;);"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="3" data-paginate="true" data-footer="Porck, T. (2017). &quot;Scribal Complaints.&quot; https://thijsporck.com/2017/06/12/scribal-complaints/. Image: Colophon drawings. &lt;a href=&quot;https://medievalbooks.nl/tag/colophons/&quot; target=&quot;_blank&quot;&gt;Source&lt;/a&gt;." data-theme="9e4aw79q01e3rr1kzx09slpft0uf8l5i68nsw8iijkc" lang="en-US" data-marpit-pagination="3" style="--paginate:true;--footer:Porck, T. (2017). &quot;Scribal Complaints.&quot; https://thijsporck.com/2017/06/12/scribal-complaints/. Image: Colophon drawings. &lt;a href=&quot;https://medievalbooks.nl/tag/colophons/&quot; target=&quot;_blank&quot;&gt;Source&lt;/a&gt;.;--theme:9e4aw79q01e3rr1kzx09slpft0uf8l5i68nsw8iijkc;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="27" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="cera-una-volta-1">C'era una volta...</h3>
<p>Ma in alcuni casi, utilizzavano il colofone anche per rivelare la realtà del loro lavoro.</p>
<p>Una delle lamentele trovata nei colofoni tra l’VIII e il XII secolo era: &quot;Tre dita scrivono, tutto il corpo fatica&quot;.</p>
<p>Altre chiedevano preghiere o sollievo fisico.</p>
<p>In questa tradizione possiamo vedere un legame diretto con il present e il lavoro invisibile che sta dietro alla creazione degli oggetti digitali.</p>

<h3 id="openness">Openness</h3>
<p><strong>Open</strong> = <em>scambio di idee, trasparenza e contenuti/software aperti</em>.</p>
<p>Se i dati non sono aperti, ciò comporta una minore interoperabilità, reperibilità, usabilità e riutilizzabilità.</p>
<p>I metadati dovrebbero sempre essere aperti, poiché rappresentano un’interpretazione o documentazione.</p>
<p>I dati sono più soggetti a normative. Ecco perché l’open source (risorse digitali legalmente accessibili a tutti) è importante.</p>

<h3 id="experimentation--play">Experimentation &amp; Play</h3>
<p><strong>Experimentation</strong> = <em>assunzione di rischi, innovazione, provare</em>.</p>
<p>È un modo importante per imparare. Fa parte della vita quotidiana e anche del processo scientifico.</p>
<p>L’idea del gioco aggiunge una dimensione ulteriore che riflette un aspetto del fare e del creare, aspetti che tradizionalmente sono stati esclusi dalla “scienza”.</p>
<p>L’esame per questo corso è un invito a mettere in pratica tutto ciò.</p>

<h3 id="social-engagement--responsibility">Social Engagement &amp; Responsibility</h3>
<p>Le DH e il lavoro basato su progetti <strong>non si limitano a rivolgersi al passato, ma anche al presente</strong>.</p>
<p>L’impegno sociale può significare scegliere un tema di ricerca che sia rilevante oggi ma che prima non lo fosse: squilibrio di genere, ingiustizia sociale, patrimonio in pericolo.</p>
<p>La responsabilità può significare prestare attenzione all’etica, alla citazione, ai pregiudizi e al consumo energetico.</p>

<h3 id="knowledge-work-is-situated">Knowledge work is situated</h3>
<p>Il lavoro intellettuale si riferisce all’elaborazione delle informazioni, in contrapposizione alla produzione fisica.</p>
<p>Nel 1988, Donna Haraway sosteneva che la conoscenza sia contestualizzata, nel senso che <strong>non può essere separata dai propri contesti</strong> (sociali, culturali, fisici) e richiede un approccio critico e una presa di responsabilità.</p>
<p>Quest'idea può essere estesa anche ai dati usati per il lavoro intellettuale.</p>

<h3 id="behind-the-object">Behind the object</h3>
<p>Dietro ogni oggetto digitalizzato si cela spesso un lavoro non riconosciuto, storicamente nascosto.</p>
<p>Comprendere come gli oggetti passino dalla forma fisica a quella digitale significa anche contestualizzare il lavoro intellettuale che tale attività rende possibile.</p>

<h3 id="better-practices">Better practices</h3>
<p>Come possiamo migliorare questa situazione?</p>
<ul>
<li>Non attribuirsi il merito del lavoro altrui.</li>
<li>Riconoscere il merito del lavoro altrui, quando possibile e previo consenso.</li>
<li>Utilizzare la documentazione o la visualizzazione per rendere visibili il lavoro e i processi.</li>
</ul>

<h3 id="what-does-it-mean-for-you">What does it mean for you?</h3>
<p>Sia che decidiate di sostenere l’esame in gruppo o individualmente, dovreste riflettere su come il lavoro venga riconosciuto e documentato, compreso quello a cui fate riferimento realizzato da altri: dai materiali digitalizzati ai software, fino alle metodologie.</p>
<p>L’esame finale rappresenta un’occasione per sperimentare con i concetti di valore e riconoscimento, al fine di comprendere come possano essere applicati, a voi stessi e agli altri, in altri contesti.</p>

<h3 id="credit-in-practice">Credit in practice</h3>
<p>I metadati rappresentano un modo semplice per attribuire il merito. Sono già il luogo in cui ci si aspetta di trovarlo.</p>
<p>La <a href="https://credit.niso.org/" target="_blank">Tassonomia dei ruoli dei collaboratori (CRedIT)</a> è stata creata nel 2014 come sistema semplice per consentire l’attribuzione esplicita del merito per come viene prodotta la ricerca.</p>
<p>Si tratta di un esempio di come sia possibile utilizzare i metadati per andare oltre i concetti consolidati di autore, creatore o editore.</p>

<h3 id="labor--credit-in-the-age-of-ai">Labor &amp; credit in the age of AI</h3>
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p>&quot;Especially now, in times of AI, <strong>we can only survive if we value work well done</strong>, or else, conditions will deteriorate for everyone.&quot; - Gengnagel &amp; Lang (2026)</p>
</blockquote>
</li>
<li data-marpit-fragment="2">
<p>Tutto ciò risulta ulteriormente complicato nel contesto attuale, in cui la GenAI viene presentata come uno strumento inevitabile. La GenAI, come le tecnologie di digitalizzazione che l’hanno preceduta, nasconde il merito e il lavoro offrendo un’unica soluzione che “sa” o “fa”. Gli strumenti di GenAI si basano sulle conoscenze altrui – i dati di addestramento – ma non ne riconoscono esplicitamente il merito.</p>
</li>
<li data-marpit-fragment="3">
<p>Ciò sottolinea l’importanza di riflettere sul perché e sul come si dovrebbero utilizzare questi strumenti nel lavoro intellettuale.</p>
</li>
</ul>
<footer>Gengnagel, T., &amp; Lang, S. (2026). On the Digital Humanities and Ideologies of Knowledge Work [Conference slides]. DH2026 (ADHO), Daejeon. <a href="https://doi.org/10.5281/zenodo.22131598">https://doi.org/10.5281/zenodo.22131598</a>.</footer>
</section>

<h3 id="unibo-policy">Unibo policy</h3>
<p>L'uso della GenAI come supporto all'apprendimento, in conformità con la <a href="https://www.unibo.it/it/ateneo/statuto-norme-strategie-bilanci/intelligenza-artificiale/intelligenza-artificiale" target="_blank"> norma Unibo sulla GenAI</a>, è consentito per questo corso e per l'esame finale.</p>
<p>Ciò comprende attività quali il supporto alla ricerca, la sintesi di documenti e la traduzione.</p>
<p>La norma opera una chiara distinzione tra <strong>uso sostanziale</strong> e <strong>non sostanziale</strong>, che potete consultare <a href="https://www.unibo.it/it/allegati/policy-per-un-uso-etico-e-responsabile-dell2019intelligenza-artificiale-generativa-nelle-attivita-di-didattica-e-ricerca/@@ download/file/Policy-Generative-AI.pdf" target="_blank">qui</a>.</p>

<h3 id="genai-for-the-exam">GenAI for the exam</h3>
<p>Le regole per l'esame seguono una logica simile, e la scelta spetta a voi.</p>
<p>Se decidete di utilizzare GenAI per generare un risultato (testo, immagine, documento, codice, analisi, ecc.), dovete documentarne l'uso secondo le <a href="https://github.com/laurentfintoni/dh-ravenna-26-27/blob/main/exam_guidelines.md" target="_blank">linee guida</a>. Si tratta di un concetto simile a quello che Unibo definisce “uso sostanziale”. Vi fornirò alcuni esempi di come deve presentarsi la documentazione.</p>
<p>Se decidete di non utilizzare GenAI, non chiederò alcuna prova. Si tratta di un sistema basato sulla fiducia.</p>

<h3 id="documenting-context">Documenting context</h3>
<p>I metadati sono informazioni relative ai dati (oggetti, schede, ecc.). Vengono utilizzati per descrivere il contenuto o la struttura dei dati.</p>
<p>Ma cosa succede se vogliamo descrivere anche il contesto in cui questi dati sono stati creati?</p>
<p>Ricorriamo alla documentazione intesa come processo. Ma possiamo anche utilizzarla come metodo. Anziché documentare dopo aver agito, possiamo documentare mentre agiamo.</p>
<footer>Albrezzi, F &amp; Drucker, J. (2025). <em>The Digital Humanities Coursebook</em>. Routledge. Image: Unsplash. <a href="https://unsplash.com/photos/art-deco-wallpaper-with-gold-motifs--lNiAirIqp4" target="_blank">Source</a>.</footer>

ition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/photo-1770983355189-9ea5b3e9a03f.jpg&quot;);"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="24" data-paginate="true" data-footer="Andersson, L., Huvila, I., &amp; Sköld, O. (2024). An Introduction to Paradata. In *Perspectives on Paradata: Research and Practice of Documenting Process Knowledge* (pp. 1–14). Springer International Publishing. https://doi.org/10.1007/978-3-031-53946-6_1. Image: Unsplash. &lt;a href=&quot;https://unsplash.com/photos/XpZhzwbjoXQ&quot; target=&quot;_blank&quot;&gt;Source&lt;/a&gt;." data-theme="9e4aw79q01e3rr1kzx09slpft0uf8l5i68nsw8iijkc" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--footer:Andersson, L., Huvila, I., &amp; Sköld, O. (2024). An Introduction to Paradata. In *Perspectives on Paradata: Research and Practice of Documenting Process Knowledge* (pp. 1–14). Springer International Publishing. https://doi.org/10.1007/978-3-031-53946-6_1. Image: Unsplash. &lt;a href=&quot;https://unsplash.com/photos/XpZhzwbjoXQ&quot; target=&quot;_blank&quot;&gt;Source&lt;/a&gt;.;--theme:9e4aw79q01e3rr1kzx09slpft0uf8l5i68nsw8iijkc;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="27" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="paradata">Paradata</h3>
<p>I <em>paradati</em> sono un concetto recente che si propone come un <strong>livello aggiuntivo ai metadati</strong>, in grado di fornire un contesto per loro: processi, prassi, decisioni.</p>
<p>Possono essere utilizzati per registrare la provenienza, i flussi di lavoro e i metodi di creazione dei dati.</p>
<p>Il modo più semplice per raccogliere i paradati consiste nel <strong>tenere una documentazione attiva</strong> di cosa, perché e come si è agito.</p>
<footer>Andersson, L., Huvila, I., &amp; Sköld, O. (2024). An Introduction to Paradata. In <em>Perspectives on Paradata: Research and Practice of Documenting Process Knowledge</em> (pp. 1–14). Springer International Publishing. <a href="https://doi.org/10.1007/978-3-031-53946-6_1">https://doi.org/10.1007/978-3-031-53946-6_1</a>. Image: Unsplash. <a href="https://unsplash.com/photos/XpZhzwbjoXQ" target="_blank">Source</a>.</footer>
</section>

<h3 id="document-as-you-go">Document as you go</h3>
<p>Concordare i valori, registrare chi ha fatto cosa, documentare l’uso di GenAI sono tutti esempi di documentazione intesa come metodo, di paradati in relazione a un progetto.</p>
<p>I progetti digitali richiedono di <strong>documentare man mano che si procede</strong>.</p>
<p>Non è facile, ma spesso è essenziale. Senza una buona documentazione è difficile ripetere o condividere facilmente il lavoro svolto.</p>

<h3 id="worklog-for-exam">Worklog for exam</h3>
<p>La documentazione per l'esame finale dovrebbe assumere la forma di un diario di lavoro (worklog), ovvero un <strong>semplice documento che riporti ciò che state facendo man mano che lo fatte</strong>.</p>
<p>Dovrebbe includere le decisioni (e il motivo), quali le fonti dei dati, le scelte relative ai metadati o interfaccia, il modo in cui avette svolto il lavoro (compreso l'uso della GenAI) ecc...</p>
<p>(va bene anche se documentate in un secondo momento, il punto è imparare.)</p>
