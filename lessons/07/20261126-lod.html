edia.org/wiki/Library_of_Congress_Subject_Headings&quot; target=&quot;_blank&quot;&gt;Source&lt;/a&gt;." data-theme="xmayad84z7e7kunkezq9jkybjv2st0gqhaanpwqrehk" lang="en-US" data-marpit-pagination="2" style="--paginate:true;--footer:Image: Printed Library of Congress Subject Headings, 29th edition. &lt;a href=&quot;https://en.wikipedia.org/wiki/Library_of_Congress_Subject_Headings&quot; target=&quot;_blank&quot;&gt;Source&lt;/a&gt;.;--theme:xmayad84z7e7kunkezq9jkybjv2st0gqhaanpwqrehk;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="37" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="left">
<h3 id="cera-una-volta">C'era una volta...</h3>
<p>Library of Congress organizza le conoscenze utilizzando i termini soggetti (subject headings): il termine ufficiale che le biblioteche dovrebbero utilizzare per descrivere l’argomento di un libro.</p>
<p>Questi termini veicolano determinati valori, come quello relativo agli “Illegal aliens”, aggiunto nel 1980.</p>
<p>Nel 2014, studenti a Dartmouth hanno presentato una petizione affinché modificasse il termine per &quot;Undocumented migrants&quot;. Non ci sono riusciti.</p>
<footer>Image: Printed Library of Congress Subject Headings, 29th edition. <a href="https://en.wikipedia.org/wiki/Library_of_Congress_Subject_Headings" target="_blank">Source</a>.</footer>
</section>

<h3 id="cera-una-volta-1">C'era una volta...</h3>
<p>Nel 2016 LoC ha annunciato che avrebbe apportato la modifica. I politici si sono opposti. Il termine è rimasto invariato.</p>
<p>Infine, nel 2021, la LoC ha sostituito il titolo con “<strong>Non citizens</strong>” e “<strong>Illegal immigration</strong>”.</p>
<p>Un termine, presente in un unico elenco ufficiale condiviso, <strong>diventa un dato utilizzato ovunque</strong>.</p>
<p>I vocabolari condivisi (controlli di autorità) sono utili e potenti, ma difficili da modificare.</p>
<footer>Image: Printed Library of Congress Subject Headings, 29th edition. <a href="https://en.wikipedia.org/wiki/Library_of_Congress_Subject_Headings" target="_blank">Source</a>.</footer>

ame&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="left">
<h3 id="one-person-many-name-spellings">One person, many name spellings</h3>
<p>Come abbiamo già visto, il nome di una persona può diventare un dato, ma non sempre con lo stesso <strong>valore</strong>.</p>
<p>A seconda della fonte, del modello o delle regole, Botticelli può essere: “Filipepi Alessandro detto Botticelli” (ICCD), “Filipepi Alessandro (Sandro Botticelli)” (Zeri) o “Botticelli, Sandro” (SBN).</p>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Sappiamo che si tratta di diverse varianti ortografiche dello stesso nome. Ma <strong>una macchina 'vede' tre nomi</strong> (valori, in questo caso stringa) diversi.</p>
<footer>Image: Unsplash. <a href="https://unsplash.com/photos/a-detailed-drawing-of-a-bird-with-a-long-beak-qPXtl0XXZ7c" target="_blank">Source</a>.</footer>
</section>

<h3 id="one-term-different-concepts">One term, different concepts</h3>
<p>Mercurio!</p>
<ul>
<li data-marpit-fragment="1"><img class="emoji" draggable="false" alt="🤔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f914.svg" data-marp-twemoji=""/> Quali concetti diversi può rappresentare Mercurio a seconda del contesto?</li>
<li data-marpit-fragment="2">Un pianeta, un dio, un metallo, persino un <a href="https://en.wikipedia.org/wiki/Freddie_Mercury" target="_blank">cantante</a>.</li>
<li data-marpit-fragment="3">Un nome o un termine di per sé non <strong>identifica</strong>. Ma un <strong>identificatore</strong> proveniente da un <em>controllo di autorità</em> sì!</li>
<li data-marpit-fragment="4">Nell’informatica, il controllo di autorità è <em>un processo di organizzazione delle informazioni</em>.</li>
</ul>
<footer>Blaney, J. (2017). Introduction to the Principles of Linked Open Data. <em>Programming Historian</em>, <em>6</em>. <a href="https://programminghistorian.org/en/lessons/intro-to-linked-data">https://programminghistorian.org/en/lessons/intro-to-linked-data</a> Image: Unsplash. <a href="https://unsplash.com/photos/a-detailed-drawing-of-a-long-billed-bird-standing-on-grass-2efQmPxBxfg" target="_blank">Source</a>.</footer>
</section>

<h3 id="authority-records">Authority records</h3>
<p><img class="emoji" draggable="false" alt="➡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/27a1.svg" data-marp-twemoji=""/> I <strong>record di autorità</strong> sono <em>elenchi strutturati di forme di superficie che vengono utilizzati come riferimenti autoritativi</em> per garantire l’accuratezza e la coerenza dei dati.</p>
<p><a href="https://viaf.org/" target="_blank">VIAF</a> per controllare nomi di persone, organizzazioni, luoghi, e opere.</p>
<p><a href="https://thes.bncf.firenze.sbn.it/" target="_blank">Il Nuovo Soggettario</a> è l'equivalente italiano dei Library of Congress Subject Headings (LCSH), utilizzati da SBN per la classificazione per argomento.</p>

<h3 id="controlled-vocabularies">Controlled Vocabularies</h3>
<p><img class="emoji" draggable="false" alt="➡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/27a1.svg" data-marp-twemoji=""/> I <strong>vocabolari controllati</strong> sono <em>liste strutturate di termini organizzati in un esplicito sistema di relazioni</em> (tra cui tassonomie e thesauri!).</p>

<h3 id="structure-of-an-authority-control">Structure of an authority control</h3>
<p>Quindi, record di autorità per forme, vocabolari controllati per definizione, entrambi per valori.</p>
<p>I controlli d'autorità utilizzano spesso strutture gerarchiche o alfabetiche per organizzare i propri contenuti, all'interno delle quali sono presenti i seguenti elementi comuni:</p>
<ul>
<li><strong>Termine preferito:</strong> la forma da utilizzare.</li>
<li><strong>Termini varianti/alternativi:</strong> altre forme che rimandano al termine preferito (equivalenza).</li>
<li><strong>Superiore:</strong> il termine/la categoria di livello superiore (gerarchia).</li>
<li><strong>Inferiore:</strong> il termine/la categoria di livello inferiore (gerarchia).</li>
<li><strong>Termini correlati:</strong> termini affini con concetti simili (associativo).</li>
</ul>
<p>Questa struttura consente alle persone o alle macchine di esplorare le relazioni tra i termini. Ogni termine è associato a un identificatore. <img class="emoji" draggable="false" alt="🤓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f913.svg" data-marp-twemoji=""/> Controlli di autorità sono un tipo di standard per i valori dei dati! (<a href="https://laurentfintoni.github.io/dh-ravenna-26-27/lessons/05/20261119-metadata.html" target="_blank">lesson 05</a>)</p>
<footer>Gilliland, A. J. (2016). Setting the Stage. In M. Baca (Ed.), <em>Introduction to Metadata</em> (3rd ed.). Getty Publications. <a href="https://www.getty.edu/publications/intrometadata/setting-the-stage/">https://www.getty.edu/publications/intrometadata/setting-the-stage/</a> Image: Unsplash. <a href="https://unsplash.com/photos/a-detailed-engraving-of-a-pelican-standing-on-grass-C1EjMQ7pB7U" target="_blank">Source</a>.</footer>

ivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="left">
<h3 id="identifiers">Identifiers</h3>
<p><strong>Unico:</strong> una cosa = un identificatore. I codici a barre, i numeri di passaporto e i codici postali sono identificatori univoci.</p>
<p><strong>Persistente:</strong> non cambia anche se l’oggetto cambia. Un <a href="https://doi.org/10.5281/zenodo.6783564" target="_blank">DOI</a> rimanda a dei dati; se i dati cambiano, il DOI no.</p>
<p><strong>Risolubile:</strong> è possibile seguirlo e arrivare da qualche parte. Un <a href="http://viaf.org/viaf/179145970098632250973" target="_blank">identificatore VIAF</a> può risolversi in una pagina VIAF.</p>
<p>Il mio <a href="https://orcid.org/0000-0002-8656-4602" target="_blank">numero ORCID</a> riportato nella prima slide è un questo tipo di identificatore.</p>
<footer>Image: Unsplash. <a href="https://unsplash.com/photos/a-dodo-bird-standing-on-a-patch-of-grass-0NXIe7TegD4" target="_blank">Source</a>.</footer>

></foreignObject><foreignObject width="50%" height="720"><section id="11" data-paginate="true" data-footer="Image: Unsplash. &lt;a href=&quot;https://unsplash.com/photos/a-detailed-sketch-of-a-large-seabird-standing-on-rocks-x8xHCKxg-Q0&quot; target=&quot;_blank&quot;&gt;Source&lt;/a&gt;." data-theme="xmayad84z7e7kunkezq9jkybjv2st0gqhaanpwqrehk" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--footer:Image: Unsplash. &lt;a href=&quot;https://unsplash.com/photos/a-detailed-sketch-of-a-large-seabird-standing-on-rocks-x8xHCKxg-Q0&quot; target=&quot;_blank&quot;&gt;Source&lt;/a&gt;.;--theme:xmayad84z7e7kunkezq9jkybjv2st0gqhaanpwqrehk;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="37" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="a-key-that-points-outside">A key that points outside?</h3>
<p>Una chiave primaria in una tabella è un identificatore <strong>unico</strong>, ma non rimanda ad altro.</p>
<p>Una chiave esterna può rimandare a un'altra tabella. Quindi l'identificatore è <strong>unico e si risolve</strong>. Rimanda a qualcosa, in questo caso ai dati presenti in un'altra tabella.</p>
<p><img class="emoji" draggable="false" alt="🤔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f914.svg" data-marp-twemoji=""/> Ma serve comunque la <strong>persistenza</strong>.</p>
<p>Entra il <em>URI</em>, che combina URL (locator) e URN (name).</p>
<footer>Image: Unsplash. <a href="https://unsplash.com/photos/a-detailed-sketch-of-a-large-seabird-standing-on-rocks-x8xHCKxg-Q0" target="_blank">Source</a>.</footer>

ot;:true}" data-marpit-advanced-background="background" data-marpit-advanced-background-split="left"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/photo-1755194994232-51e859bd7f76.jpg&quot;);"></figure></div></section></foreignObject><foreignObject width="50%" height="720" x="50%"><section id="12" data-paginate="true" data-footer="Blaney, J. (2017). Introduction to the Principles of Linked Open Data. *Programming Historian*, *6*. https://programminghistorian.org/en/lessons/intro-to-linked-data Image: Unsplash. &lt;a href=&quot;https://unsplash.com/photos/a-black-and-white-drawing-of-a-bird-on-rocks-rFnAS4vKSd0&quot; target=&quot;_blank&quot;&gt;Source&lt;/a&gt;." data-theme="xmayad84z7e7kunkezq9jkybjv2st0gqhaanpwqrehk" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--footer:Blaney, J. (2017). Introduction to the Principles of Linked Open Data. *Programming Historian*, *6*. https://programminghistorian.org/en/lessons/intro-to-linked-data Image: Unsplash. &lt;a href=&quot;https://unsplash.com/photos/a-black-and-white-drawing-of-a-bird-on-rocks-rFnAS4vKSd0&quot; target=&quot;_blank&quot;&gt;Source&lt;/a&gt;.;--theme:xmayad84z7e7kunkezq9jkybjv2st0gqhaanpwqrehk;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="37" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="left">
<h3 id="uniform-resource-identifier">Uniform Resource Identifier</h3>
<p>Un URI è un identificatore costituito da <strong>una sequenza univoca di caratteri</strong> abbinata a un sistema di risoluzione che consente di raggiungere una destinazione (in genere una pagina web).</p>
<p><a href="http://viaf.org/viaf/179145970098632250973" target="_blank">viaf.org/viaf/179145970098632250973</a> = <em>179145970098632250973</em> è l’URI; <em>viaf.org/viaf/</em> il risolutore.</p>
<p>Gli URI sono <strong>identificatori persistenti</strong> che 'rimandano alle tabelle di qualcun altro'. Sono una forma di chiave esterna per collegare i dati!</p>

<h3 id="connecting-databases">Connecting databases</h3>
<p>Ogni istituzione che si occupa di beni culturali dispone di propri database, spesso contenenti dati simili.</p>
<p>Se utilizzano controlli di autorità, tramite identificatori URI, i loro record possono essere collegati senza copiare nulla!</p>
<p>La Fondazione Zeri utilizza VIAF, ULAN e Wikidata per collegare il proprio valore “autore” a controlli di autorità esterni.</p>
<p><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Ora i sistemi automatici 'capiscono' chi è l’autore. E le persone possono verificare se hanno dei dubbi.</p>
</section>

<h6 id="part-2">Part 2</h6>
<h1 id="from-relations-to-statements">from relations to <strong>statements</strong></h1>
<h2 id="or-why-graphs-are-sometimes-better-than-tables">(or why graphs are sometimes better than tables)</h2>
</section>

storical Social Research Supplement 31, 170–179. https://doi.org/10.12759/hsr.suppl.31.2018.170-179 Image: Unsplash. &lt;a href=&quot;https://unsplash.com/photos/a-detailed-drawing-of-a-bird-standing-on-grass-t0pLFG65CYI&quot; target=&quot;_blank&quot;&gt;Source&lt;/a&gt;." data-theme="xmayad84z7e7kunkezq9jkybjv2st0gqhaanpwqrehk" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--footer:Tomasi, F. (2020). _Modelling in the Digital Humanities: Conceptual Data Models and Knowledge Organization in the Cultural Heritage Domain_. Historical Social Research Supplement 31, 170–179. https://doi.org/10.12759/hsr.suppl.31.2018.170-179 Image: Unsplash. &lt;a href=&quot;https://unsplash.com/photos/a-detailed-drawing-of-a-bird-standing-on-grass-t0pLFG65CYI&quot; target=&quot;_blank&quot;&gt;Source&lt;/a&gt;.;--theme:xmayad84z7e7kunkezq9jkybjv2st0gqhaanpwqrehk;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="37" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="left">
<h3 id="from-relational-to-graph">From Relational to Graph</h3>
<p>I dati possono essere strutturati come una sequenza (lista), una tabella (relazioni) o un albero (gerarchia).</p>
<p><img class="emoji" draggable="false" alt="🤓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f913.svg" data-marp-twemoji=""/> Questi sono tutti modelli di dati!</p>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Il World Wide Web (Internet) è una <strong>rete</strong>, in cui i dati sono collegati tramite relazioni tra pagine web o tra database.</p>
<p>Il modo più comune per rappresentare una rete è tramite una <strong>struttura di grafo</strong>. Si tratta di un <em>altro tipo di modello di dati</em>, oggi molto diffuso.</p>
<footer>Tomasi, F. (2020). <em>Modelling in the Digital Humanities: Conceptual Data Models and Knowledge Organization in the Cultural Heritage Domain</em>. Historical Social Research Supplement 31, 170–179. <a href="https://doi.org/10.12759/hsr.suppl.31.2018.170-179">https://doi.org/10.12759/hsr.suppl.31.2018.170-179</a> Image: Unsplash. <a href="https://unsplash.com/photos/a-detailed-drawing-of-a-bird-standing-on-grass-t0pLFG65CYI" target="_blank">Source</a>.</footer>
</section>

<h3 id="relationships-as-statements">Relationships as statements</h3>
<p>Nella lezione 06 abbiamo trattato il modello Entità/Relazione: Entità <img class="emoji" draggable="false" alt="➡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/27a1.svg" data-marp-twemoji=""/> Relazione <img class="emoji" draggable="false" alt="➡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/27a1.svg" data-marp-twemoji=""/> Entità.</p>
<p>In un grafo questo è noto come <strong>affermazione</strong> (statement), ovvero ciò che i grafi comunicano attraverso la loro struttura.</p>
<table>
<thead>
<tr>
<th>Entity</th>
<th>Relation</th>
<th>Entity</th>
</tr>
</thead>
<tbody>
<tr>
<td><em>Nascita di Venere</em></td>
<td>made by</td>
<td>Sandro Botticelli</td>
</tr>
<tr>
<td><em>Nascita di Venere</em></td>
<td>held by</td>
<td>Galleria degli Uffizi</td>
</tr>
<tr>
<td>Sandro Botticelli</td>
<td>born in</td>
<td>Firenze</td>
</tr>
</tbody>
</table>
<p>In una tabella piatta la relazione si trova nel <em>nome della colonna</em>. In un grafo si trova nel <em>collegamento</em> tra le entità (proprio come nel diagramma E/R).</p>

<h3 id="statements-make-a-graph">Statements make a graph</h3>
<p>In un grafo, le entità sono chiamate <em>nodi</em>, mentre le relazioni sono chiamate <em>archi</em>. Possono andare in qualsiasi direzione.</p>
<p>In un database relazionale, per aggiungere qualcosa è necessario creare una nuova colonna e inserire i valori. In un grafo basta semplicemente aggiungere una connessione!</p>
<p>In un database a grafo, un computer può seguire queste istruzioni per collegare i dati tra loro e 'comprenderli'.</p>
<p>Il <a href="https://it.wikipedia.org/wiki/Resource_Description_Framework" target="_blank">Resource Description Framework</a> (RDF) è uno standard (e modello) comune per la scrittura di queste affermazione.</p>
</section>

zontal"><figure style="background-image:url(&quot;img/3840px-CiDOC_CRM_CONCEPTUALISATION__Genesis_and_application_.svg.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="50%" height="720" x="50%"><section id="18" data-paginate="true" data-footer="Blaney, J. (2017). Introduction to the Principles of Linked Open Data. *Programming Historian*, *6*. https://programminghistorian.org/en/lessons/intro-to-linked-data Image: CIDOC CRM conceptualisation. &lt;a href=&quot;https://en.wikipedia.org/wiki/CIDOC_Conceptual_Reference_Model&quot; target=&quot;_blank&quot;&gt;Source&lt;/a&gt;." data-theme="xmayad84z7e7kunkezq9jkybjv2st0gqhaanpwqrehk" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--footer:Blaney, J. (2017). Introduction to the Principles of Linked Open Data. *Programming Historian*, *6*. https://programminghistorian.org/en/lessons/intro-to-linked-data Image: CIDOC CRM conceptualisation. &lt;a href=&quot;https://en.wikipedia.org/wiki/CIDOC_Conceptual_Reference_Model&quot; target=&quot;_blank&quot;&gt;Source&lt;/a&gt;.;--theme:xmayad84z7e7kunkezq9jkybjv2st0gqhaanpwqrehk;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="37" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="left">
<h3 id="controlling-statements">Controlling statements</h3>
<p>Se ognuno inventasse le proprie entità e relazioni, le affermazioni contenute in un grafo non potrebbero collegarsi tra loro.</p>
<p>Un’<strong>ontologia</strong> è un 'tipo' di vocabolario controllato (e di modello!) che definisce quali entità e relazioni esistono in un determinato dominio. Un database a grafo le utilizza affinché le macchine (e noi) possano 'capire' le affermazioni.</p>
<p><a href="https://cidoc-crm.org/" target="_blank">CIDOC-CRM</a> è lo standard internazionale e l’ontologia per il patrimonio culturale.</p>
<footer>Blaney, J. (2017). Introduction to the Principles of Linked Open Data. <em>Programming Historian</em>, <em>6</em>. <a href="https://programminghistorian.org/en/lessons/intro-to-linked-data">https://programminghistorian.org/en/lessons/intro-to-linked-data</a> Image: CIDOC CRM conceptualisation. <a href="https://en.wikipedia.org/wiki/CIDOC_Conceptual_Reference_Model" target="_blank">Source</a>.</footer>
</section>

{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="world-wide-web-a-short-history">World Wide Web: a short history</h3>
<p><em>Web 1.0</em> è l'idea di un <strong>web di pagine</strong>, in cui le pagine rimandano ad altre, destinate alla lettura da parte delle persone. (1989)</p>
<p><em>Web 2.0</em> è l'idea di un <strong>web sociale</strong>, in cui gli utenti partecipano attivamente. (1999)</p>
<p><em>Web 3.0</em> è l’idea di un <strong>web di dati</strong>, in cui le affermazioni sono collegate tra loro, affinché le macchine possano seguirle e 'capirle'. (2001)</p>
<p>Tutto questo coesiste oggì. Web 3.0 è chiamato <strong>web semantico</strong> perché nelle affermazioni è presente un significato.</p>

<h3 id="linked-open-data">Linked Open Data</h3>
<p>L'idea di un web di dati nasce da Tim Berners-Lee, che nel 1989 ha inventato il World Wide Web (Internet = tecnologia, www = sistema informativo). Per renderla reale, sosteneva che i dati dovessero essere <strong>collegati</strong> e <strong>aperti</strong>.</p>
<p><strong>Collegati:</strong> i dati utilizzano identificatori condivisi e rimandano ad altri dati (URI).</p>
<p><strong>Aperti:</strong> una licenza per riutilizzo.</p>
<p><strong>Web semantico:</strong> le macchine possono 'leggere' il web perché i dati hanno un significato.</p>
<footer>Image: Unsplash. <a href="https://unsplash.com/photos/an-ibis-bird-stands-on-a-patch-of-grass-Sf-ERTQbGPI" target="_blank">Source</a>.</footer>

<li><img class="emoji" draggable="false" alt="⭐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2b50.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="⭐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2b50.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="⭐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2b50.svg" data-marp-twemoji=""/> + in un formato aperto (CSV).</li>
<li><img class="emoji" draggable="false" alt="⭐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2b50.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="⭐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2b50.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="⭐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2b50.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="⭐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2b50.svg" data-marp-twemoji=""/> + semantica (RDF, URI).</li>

<h3 id="the-lod-cloud">The LOD cloud</h3>
<p>Tutto questo è bello, ma solo se lo fanno tutti (o almeno in molti).</p>
<p>Nel 2007 c’erano 12 dataset di Linked Open Data. Oggi ce ne sono più di 1,300. Potete vederli in questa nuvola che viene di un progetto chiamato <a href="https://lod-cloud.net/" target="_blank">LOD Cloud</a>.</p>
<p>Ogni cerchio (nodo) rappresenta un dataset. Ogni linea indica un collegamento ad un altro (arco). È un grafo!</p>
<p>Aiuta a capire cosa esiste oggi in Linked Open Data e come (ri)utilizzarlo.</p>
<footer>Image: The Linked Open Data Cloud. <a href="https://lod-cloud.net/" target="_blank">Source</a>.</footer>

<h3 id="italian-cultural-heritage--linked-open-data">Italian cultural heritage &amp; Linked Open Data</h3>
<p>1/ Il <a href="https://dati.beniculturali.it/lodview/resource/datasetNuovoSoggettario.html" target="_blank">Nuovo Soggettario</a> è pubblicato come Linked Open Data dal 2010, con licenza CC BY 4.0, e contiene collegamenti a LCSH e Wikidata. È presente nel <a href="https://lod-cloud.net/dataset/bncf-ns" target="_blank">LOD cloud</a>.</p>
<p>2/ Il Catalogo generale dei beni culturali è pubblicato in Linked Open Data sotto il nome <a href="https://dati.beniculturali.it/arco/index.php" target="_blank">grafo di conoscenza ArCo</a>. I <a href="https://dati.cultura.gov.it/lodview-arco/resource/HistoricOrArtisticProperty/0900158551.html" target="_blank">collegamenti RDF</a> presenti nelle schede del catalogo (lezione 05) vengono creati utilizzando ArCo.</p>
<p>3/ L'<a href="https://catalogo.fondazionezeri.unibo.it/home/en" target="_blank">Archivio Fotografico Zeri</a> è una versione digitale delle fotografie dello storico dell'arte Federico Zeri. Nel 2003, la Fondazione Zeri ha avviato la creazione di un database relazionale dei documenti (Scheda F e OA). Unibo collabora con loro dal 2016 per trasformare il tutto in un grafo di Linked Open Data (11 milioni di affermazioni, 1,6 milioni di entità!) che include ontologie, controlli di autorità e collegamenti ad altri dataset sull’arte.</p>
<footer>Daquino, M., Mambelli, F., Peroni, S., Tomasi, F., &amp; Vitali, F. (2017). <em>Enhancing semantic expressivity in the cultural heritage domain: exposing the Zeri Photo Archive as Linked Open Data</em>. Journal on Computing and Cultural Heritage (JOCCH), 10(4), 1-21. <a href="https://arxiv.org/abs/1605.01188">https://arxiv.org/abs/1605.01188</a></footer>
</section>

&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="what-wikidata-is">What Wikidata is</h3>
<p>È il 'database' dei dati strutturati utilizzati dai progetti Wikimedia, come Wikipedia. È gratuito e aperto.</p>
<p>Le schede di Wikidata hanno un identificatore (QID), affermazioni e collegamenti ad altri database aperti.</p>
<p>Chiunque può consultarlo, metterlo in discussione e modificarlo! Nel 2025 contava oltre 1,65 miliardi di affermazioni.</p>
<p>Perché? Per garantire che i dati di Wikimedia siano facilmente (ri)utilizzabili da tutti (aperti!).</p>

<h3 id="anatomy-of-an-item">Anatomy of an item</h3>
<p>La <em>Venere</em> su Wikidata è <a href="https://www.wikidata.org/wiki/Q151047" target="_blank">Q151047</a>.</p>
<ul>
<li><strong>Etichetta:</strong> il nome, in una o più lingue (il titolo della scheda).</li>
<li><strong>Affermazioni:</strong> relazione e valore, uno dopo l'altro.</li>
<li><strong>Riferimenti:</strong> da dove proviene il valore dell'affermazione.</li>
<li><strong>Qualificatori:</strong> contesto di un'affermazione.</li>
<li><strong>Identificatori:</strong> collegamenti a controlli di autorità e altre database.</li>
<li><strong>Wikimedia:</strong> collegamenti a items di Wikimedia relative alla stessa entità.</li>
</ul>

ion id="28" data-paginate="true" data-footer="Image: Wikimedia family. &lt;a href=&quot;https://en.wikipedia.org/wiki/Wikimedia_Foundation&quot; target=&quot;_blank&quot;&gt;Source&lt;/a&gt;." data-theme="xmayad84z7e7kunkezq9jkybjv2st0gqhaanpwqrehk" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--footer:Image: Wikimedia family. &lt;a href=&quot;https://en.wikipedia.org/wiki/Wikimedia_Foundation&quot; target=&quot;_blank&quot;&gt;Source&lt;/a&gt;.;--theme:xmayad84z7e7kunkezq9jkybjv2st0gqhaanpwqrehk;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="37" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="an-authority-control-sort-of">An authority control, sort of</h3>
<p>Wikidata non è stato creato come controllo di autorità, ma, essendo libero, aperto e basato sui principi del LOD, viene molto spesso utilizzato proprio come tale.</p>
<p>È un modo semplice per le persone (come voi!) di dire “questa cosa è questa” rimandando a una pagina di Wikidata, che a sua volta rimanda ad altri sistemi di controllo di autorità 'ufficiali'.</p>
<p>Un modo per considerarlo è come un sistema di controllo di autorità pubblico, proprio come Wikipedia è un’enciclopedia pubblica perché chiunque può contribuire.</p>
<footer>Image: Wikimedia family. <a href="https://en.wikipedia.org/wiki/Wikimedia_Foundation" target="_blank">Source</a>.</footer>
</section>

<h3 id="asking-the-graph-a-question">Asking the graph a question</h3>
<p>È possibile interrogare molti dataset in LOD, come <a href="https://query-next.wikidata.org/" target="_blank">Wikidata</a>. Poiché il grafo è una rete di affermazioni, è possibile porre una domanda e il sistema è in grado di rispondere con il livello di semantica. A tal fine utilizziamo un linguaggio di interrogazione chiamato SPARQL.</p>
<pre><code class="language-sparql">SELECT DISTINCT ?id ?titolo
WHERE {
  ?id wdt:P31 wd:Q3305213;
      wdt:P17 wd:Q38;
      rdfs:label ?titolo.
  FILTER(LANG(?titolo) = &quot;it&quot;)
}
</code></pre>
<p><em>In linguaggio naturale:</em> trova tutti gli elementi che <strong>sono</strong> (P31) un dipinto (Q3305213), il cui <strong>paese</strong> (P17) è l'Italia (Q38), e indicami il loro <strong>titolo</strong> in italiano.</p>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Oggi ci divertiamo un po' con SPARQL, ma non è necessario impararlo (se non volete).</p>
</section>

<h3 id="official-vs-community-terms">Official vs community terms</h3>
<p>Ricordate <a href target="_blank">gli esercizi della lezione 05</a>: una <strong>tassonomia</strong> è un elenco di termini stabiliti dall’alto, mentre una <strong>folksonomia</strong> è un elenco di termini stabiliti dagli utenti (dal basso).</p>
<p>Collegarsi a un controllo di autorità o a un vocabolario non significa rinunciare ai propri termini!</p>
<p>Se non esiste un termine condiviso per ciò che intendete, mantienete il vostro e documentate il motivo!</p>
<p>“Nessuna corrispondenza” è un risultato.</p>
